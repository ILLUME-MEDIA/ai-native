name: Laravel + React Auto Deploy to cPanel via FTP

# Trigger workflow on push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js for React build (Node 20 for Vite 7)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install NPM dependencies & Build React
        run: |
          npm install
          npm run build

      # 3️⃣ Setup PHP for Laravel
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # 4️⃣ Deploy to cPanel via FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.env
            **/storage/app/public/**
            !**/storage/app/public/.gitignore
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/logs/**
            **/public/uploads/ecommerce/**
            !**/public/uploads/ecommerce/.gitignore
            !**/public/uploads/ecommerce/**/.gitkeep

      # 5️⃣ Run migrations & storage:link on the live server
      - name: Run migrations & storage:link
        run: |
          curl -sf "${{ secrets.APP_URL }}/run-migrations" | jq . || echo "Post-deploy hook failed (non-fatal)"