<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyApps API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #fafafa; }

    /* Top bar */
    #topbar {
      background: #1b1b1b;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    #topbar h1 {
      color: #fff;
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .key-hint {
      color: #888;
      font-size: 11px;
      margin-top: 2px;
    }
    #topbar .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #topbar label {
      color: #aaa;
      font-size: 13px;
    }
    #token-input {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 13px;
      width: 320px;
      outline: none;
    }
    #token-input:focus { border-color: #49cc90; }
    #save-token-btn {
      padding: 6px 14px;
      background: #49cc90;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #save-token-btn:hover { background: #3ab87b; }
    #token-status {
      font-size: 12px;
      color: #49cc90;
      display: none;
    }
    #base-url-input {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 13px;
      width: 220px;
      outline: none;
    }
    #base-url-input:focus { border-color: #61affe; }
    #apply-url-btn {
      padding: 6px 14px;
      background: #61affe;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #apply-url-btn:hover { background: #4c9fee; }

    /* Swagger UI overrides */
    .swagger-ui .topbar { display: none !important; }
    .swagger-ui .info { margin: 20px 0 10px 0; }
    #swagger-ui { max-width: 1200px; margin: 0 auto; padding: 20px; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>⚡ MyApps API Docs</h1>
  <div class="actions">
    <div style="display:flex;align-items:center;gap:6px">
      <label for="base-url-input">Base URL:</label>
      <input id="base-url-input" type="text" placeholder="http://127.0.0.1:8000" />
      <button id="apply-url-btn">Apply</button>
    </div>
    <div style="width:1px;height:28px;background:#444"></div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;gap:6px">
        <label for="token-input">Bearer Token:</label>
        <input id="token-input" type="text" placeholder="Sanctum token OR SITE_API_KEY…" />
        <button id="save-token-btn">Authorize</button>
        <span id="token-status">✓ Set</span>
      </div>
      <div class="key-hint">Admin APIs: use Sanctum token (POST /api/auth/token) &nbsp;|&nbsp; register-business: use SITE_API_KEY</div>
    </div>
  </div>
</div>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const YAML_URL = window.location.origin + '/api-docs/openapi.yaml';

  let ui; // SwaggerUI instance

  // ── Restore saved token / URL ──────────────────────────────────────────
  const savedToken   = localStorage.getItem('api_bearer_token') || '';
  const savedBaseUrl = localStorage.getItem('api_base_url') || window.location.origin;

  document.getElementById('token-input').value   = savedToken;
  document.getElementById('base-url-input').value = savedBaseUrl;

  // ── Init Swagger UI ───────────────────────────────────────────────────
  function initSwagger(baseUrl, token) {
    // Patch the YAML on the fly using a request interceptor
    ui = SwaggerUIBundle({
      url: YAML_URL,
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: 'BaseLayout',
      deepLinking: true,
      persistAuthorization: true,
      tryItOutEnabled: true,
      filter: true,
      requestInterceptor: function(req) {
        // Inject Bearer token
        const tok = localStorage.getItem('api_bearer_token');
        if (tok) {
          req.headers['Authorization'] = 'Bearer ' + tok;
        }
        // Replace server URL variable
        const base = localStorage.getItem('api_base_url') || window.location.origin;
        req.url = req.url.replace(/^https?:\/\/[^\/]+\/api\//, base + '/api/');
        return req;
      },
      responseInterceptor: function(res) { return res; },
      onComplete: function() {
        // Auto-authorize if token is saved
        if (savedToken) {
          ui.preauthorizeApiKey('bearerAuth', savedToken);
        }
      },
    });
  }

  initSwagger(savedBaseUrl, savedToken);

  // ── Authorize button ──────────────────────────────────────────────────
  document.getElementById('save-token-btn').addEventListener('click', function() {
    const token = document.getElementById('token-input').value.trim();
    localStorage.setItem('api_bearer_token', token);
    if (ui) ui.preauthorizeApiKey('bearerAuth', token);
    const status = document.getElementById('token-status');
    status.style.display = 'inline';
    setTimeout(() => status.style.display = 'none', 2000);
  });

  // ── Apply base URL ────────────────────────────────────────────────────
  document.getElementById('apply-url-btn').addEventListener('click', function() {
    const url = document.getElementById('base-url-input').value.trim().replace(/\/$/, '');
    localStorage.setItem('api_base_url', url);
    // Re-init so server variable updates
    document.getElementById('swagger-ui').innerHTML = '';
    initSwagger(url, localStorage.getItem('api_bearer_token') || '');
  });
</script>
</body>
</html>
