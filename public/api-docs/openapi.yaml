  # ── MENU ──────────────────────────────────────────────────────────────────

  /ecommerce/menu-items:
    get:
      tags:
        - Menu
      security: []
      summary: List all menu items (with filters)
      description: |
        **Query filters** — use to fetch by restaurant, category, availability or search:
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
          description: Filter by business (restaurant) ID
        - name: category_id
          in: query
          schema:
            type: integer
          description: Filter by menu_category_id (e.g. Starters, Mains)
        - name: search
          in: query
          schema:
            type: string
          description: Search in item name and description (partial match)
        - name: is_available
          in: query
          schema:
            type: boolean
          description: If true/false, filter by availability
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Paginated menu items with business and menuCategory

  /ecommerce/muzzhub/{id}/menu-categories:
    get:
      tags:
        - Menu
        - Muzzhub
      security: []
      summary: List menu categories for a Muzzhub seller
      description: |
        Uses the Muzzhub's linked Business. Returns 404 if no business_id is set.
        Link a Business to the Muzzhub listing to enable menu and order flow.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Muzzhub listing ID
      responses:
        "200":
          description: List of menu categories with item counts
        "404":
          description: No business linked for this seller

  /ecommerce/muzzhub/{id}/menu-items:
    get:
      tags:
        - Menu
        - Muzzhub
      security: []
      summary: List menu items for a Muzzhub seller
      description: Uses the Muzzhub's linked Business. 404 if no business linked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Muzzhub listing ID
        - name: category_id
          in: query
          schema:
            type: integer
            description: menu_category_id filter
      responses:
        "200":
          description: List of menu items with menuCategory
        "404":
          description: No business linked for this seller

  /ecommerce/businesses/{businessId}/menu-categories:
    get:
      tags:
        - Menu
      security: []
      summary: List menu categories for a business
      description: Returns categories with menu item counts. No query filters (path businessId only).
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of menu categories (withCount menuItems)
    post:
      tags:
        - Menu
      summary: Create menu category
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Starters
                description:
                  type: string
                  example: Appetisers and small plates
                sort_order:
                  type: integer
                  default: 0
                is_active:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Created

  /ecommerce/businesses/{businessId}/menu-categories/{id}:
    patch:
      tags:
        - Menu
      summary: Update menu category
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                sort_order:
                  type: integer
                is_active:
                  type: boolean
      responses:
        "200":
          description: Updated
    delete:
      tags:
        - Menu
      summary: Delete menu category
      description: Menu items in this category will have their category unset.
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
