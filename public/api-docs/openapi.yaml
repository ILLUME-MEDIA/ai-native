            type: integer
      responses:
        "200":
          $ref: "#/components/responses/MessageOk"

  # ── CUISINES ──────────────────────────────────────────────────────────────

  /ecommerce/cuisines:
    get:
      tags:
        - Cuisines
      security: []
      summary: List cuisines
      description: |
        **Public (no auth)** — returns active cuisines only (flat array), used for storefront filters and seller forms.

        **Admin mode** — pass `?admin=1` with a Sanctum Bearer token to get paginated results with `muzzs_count` (number of restaurants per cuisine) and both active + inactive records.
      parameters:
        - name: admin
          in: query
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: "Set to 1 for admin mode: paginated, all cuisines, includes muzzs_count"
        - name: search
          in: query
          schema:
            type: string
          description: Search in cuisine name (admin mode only)
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
          description: Items per page (admin mode only)
      responses:
        "200":
          description: |
            **Public:** flat array of active cuisines.
            **Admin:** paginated object with `data[]`, `total`, `last_page`.
          content:
            application/json:
              schema:
                oneOf:
                  - description: Public — flat array
                    type: array
                    items:
                      $ref: "#/components/schemas/CuisinePublic"
                  - description: Admin — paginated
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CuisineAdmin"
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      total:
                        type: integer
              examples:
                public:
                  summary: Public response (active only)
                  value:
                    - id: 1
                      name: Afghan
                      slug: afghan
                      icon: "flame"
                      hover_icon: null
                admin:
                  summary: Admin response (paginated + counts)
                  value:
                    data:
                      - id: 1
                        name: Afghan
                        slug: afghan
                        icon: "flame"
                        hover_icon: null
                        is_active: true
                        sort_order: 0
                        muzzs_count: 12
                    current_page: 1
                    last_page: 4
                    total: 52
    post:
      tags:
        - Cuisines
      summary: Create cuisine (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuisineWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuisineAdmin"

  /ecommerce/cuisines/activate-all:
    put:
      tags:
        - Cuisines
      summary: Activate all cuisines (admin)
      description: Sets `is_active = true` on every cuisine. Returns count of updated records.
      responses:
        "200":
          description: All cuisines activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "All cuisines activated. (23 updated)"

  /ecommerce/cuisines/dedup:
    post:
      tags:
        - Cuisines
      summary: Merge duplicate cuisines (admin)
      description: |
        Finds cuisines with the same name (case-insensitive), keeps the one with the lowest ID,
        re-attaches all restaurant pivot rows to the winner, and deletes duplicates.
      responses:
        "200":
          description: Dedup complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Dedup complete. Removed 3 duplicate(s)."
                  removed:
                    type: integer
                    example: 3

  /ecommerce/cuisines/{id}:
    patch:
      tags:
        - Cuisines
      summary: Update cuisine (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuisineWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuisineAdmin"
    delete:
      tags:
        - Cuisines
      summary: Delete cuisine (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/MessageOk"

