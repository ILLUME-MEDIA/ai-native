    # ── TAX LOOKUP ──────────────────────────────────────────────────────────────

    TaxResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            found:
              type: boolean
              description: false if ZIP code not found in the tax database
              example: true
            zip_code:
              type: string
              example: "90001"
            tax_region:
              type: string
              nullable: true
              description: Name of the primary tax region for this ZIP (e.g. "LOS ANGELES")
              example: "HUNTINGTON PARK"
            state:
              type: string
              nullable: true
              description: Two-letter state code
              example: "CA"
            tax_rate:
              type: number
              format: float
              description: Combined tax rate as a decimal (e.g. 0.105 = 10.5%)
              example: 0.105
            tax_percentage:
              type: string
              description: Human-readable percentage string
              example: "10.5000%"
            tax_amount:
              type: string
              description: Calculated tax amount in dollars (string to preserve precision)
              example: "10.50"
            subtotal:
              type: string
              description: Original subtotal in dollars
              example: "100.00"
            total:
              type: string
              description: subtotal + tax_amount
              example: "110.50"
            risk_level:
              type: integer
              description: |
                Number of tax jurisdictions that overlap this ZIP code.
                0 = single jurisdiction (precise). Higher = multiple boundaries (estimate may vary ±5%).
              example: 0
            breakdown:
              type: object
              description: Tax rate components that sum to tax_rate
              properties:
                state_rate:
                  type: number
                  example: 0.06
                county_rate:
                  type: number
                  example: 0.0025
                city_rate:
                  type: number
                  example: 0.0075
                special_rate:
                  type: number
                  description: Special district rate (transit, fire, etc.)
                  example: 0.035

    # ── DELIVERY QUOTE ─────────────────────────────────────────────────────────

    DeliveryQuoteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        vendor:
          type: string
          enum: [doordash, ubereats, instacart, own]
          example: doordash
        fee:
          type: number
          nullable: true
          description: Delivery fee in dollars
          example: 5.99
        fee_cents:
          type: integer
          nullable: true
          description: Delivery fee in cents (DoorDash native unit)
          example: 599
        tax:
          type: number
          nullable: true
          description: Delivery tax in dollars (DoorDash only)
          example: 0.52
        tax_cents:
          type: integer
          nullable: true
          description: Delivery tax in cents (DoorDash only)
          example: 52
        currency:
          type: string
          example: USD
        estimated_minutes:
          type: integer
          nullable: true
          description: Estimated delivery time in minutes
          example: 42
        pickup_time:
          type: string
          format: date-time
          nullable: true
          description: Estimated pickup time ISO-8601 UTC (DoorDash v1/estimates)
          example: "2026-03-02T17:30:00Z"
        delivery_time:
          type: string
          format: date-time
          nullable: true
          description: Estimated delivery time ISO-8601 UTC (DoorDash v1/estimates)
          example: "2026-03-02T18:12:00Z"
        min_order_amount:
          type: number
          example: 0
        expires_at:
          type: string
          format: date-time
          nullable: true
        quote_id:
          type: string
          nullable: true
          description: DoorDash estimate ID or external_delivery_id
        in_zone:
          type: boolean
          nullable: true
          description: Only returned for vendor=own
        zone:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            description:
              type: string
              nullable: true
        note:
          type: string
          nullable: true
          description: Informational note (e.g. UberEats manages final fee)
        message:
          type: string
          nullable: true
        raw:
          type: object
          nullable: true
          description: Raw vendor API response (doordash only)

