      responses:
        "200":
          description: Order updated

  /delivery/zones/{deliveryZone}:
    get:
      tags:
        - Delivery Zones
      summary: Get zone detail
      parameters:
        - name: deliveryZone
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Zone detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"
    patch:
      tags:
        - Delivery Zones
      summary: Update zone
      parameters:
        - name: deliveryZone
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneInput"
      responses:
        "200":
          description: Zone updated
    delete:
      tags:
        - Delivery Zones
      summary: Delete zone
      parameters:
        - name: deliveryZone
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Zone deleted

  # ── DELIVERY STAFF ───────────────────────────────────────────────────────────

  /delivery/staff:
    get:
