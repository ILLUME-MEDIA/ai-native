      responses:
        '200': { description: List of carrier-specific options }

  /shipengine/rates:
    post:
      summary: Get shipping rates
      description: |
        Compare rates across all connected carriers for a shipment.
        Pass `rate_options.carrier_ids` to limit to specific carriers.
      tags: [ShipEngine — Rates]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipment]
              properties:
                shipment:
                  $ref: '#/components/schemas/SE_ShipmentInput'
                rate_options:
                  type: object
                  properties:
                    carrier_ids:        { type: array, items: { type: string } }
                    service_codes:      { type: array, items: { type: string } }
                    preferred_currency: { type: string, example: usd }
            example:
              shipment:
                ship_to:
                  name: "Jane Doe"
                  address_line1: "525 S Winchester Blvd"
                  city_locality: "San Jose"
                  state_province: "CA"
                  postal_code: "95128"
                  country_code: "US"
                ship_from:
                  name: "My Store"
                  address_line1: "100 Shipping Lane"
                  city_locality: "Austin"
                  state_province: "TX"
                  postal_code: "78701"
                  country_code: "US"
                packages:
                  - weight: { value: 1.0, unit: pound }
              rate_options:
                carrier_ids: ["se-123456"]
      responses:
        '200': { description: Rate results }
        '422': { description: Validation error }
        '502': { description: ShipEngine API error }

  /shipengine/rates/bulk:
    post:
      summary: Get bulk shipping rates
      description: |
        Get rates for multiple shipments in one request.
        Useful for rating a batch/cart with multiple packages/shipments.
      tags: [ShipEngine — Rates]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipments]
              properties:
                shipments:
                  type: array
                  items:
                    $ref: '#/components/schemas/SE_ShipmentInput'
                rate_options:
                  type: object
                  properties:
                    carrier_ids:        { type: array, items: { type: string } }
                    service_codes:      { type: array, items: { type: string } }
                    preferred_currency: { type: string, example: usd }
            example:
              shipments:
                - ship_to:
                    name: "Jane Doe"
                    address_line1: "525 S Winchester Blvd"
                    city_locality: "San Jose"
                    state_province: "CA"
                    postal_code: "95128"
                    country_code: "US"
                  ship_from:
                    name: "My Store"
                    address_line1: "100 Shipping Lane"
                    city_locality: "Austin"
                    state_province: "TX"
                    postal_code: "78701"
                    country_code: "US"
                  packages:
                    - weight: { value: 1.0, unit: pound }
              rate_options:
                carrier_ids: ["se-123456"]
      responses:
        '200': { description: Bulk rate results }
        '422': { description: Validation error }
        '502': { description: ShipEngine API error }

  /shipengine/rates/estimate:
    post:
      summary: Estimate rates (quick, minimal info)
      description: |
        Get a rough rate estimate without a full address or carrier account.
        Useful for showing shipping cost previews on product pages.
      tags: [ShipEngine — Rates]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_country_code, from_postal_code, to_country_code, to_postal_code, weight]
              properties:
                carrier_id:        { type: string }
                from_country_code: { type: string, example: US }
                from_postal_code:  { type: string, example: "78701" }
                to_country_code:   { type: string, example: US }
                to_postal_code:    { type: string, example: "95128" }
                to_city_locality:  { type: string }
                to_state_province: { type: string }
                weight:
                  type: object
                  required: [value, unit]
                  properties:
                    value: { type: number, example: 1.0 }
                    unit:  { type: string, enum: [pound, ounce, gram, kilogram] }
                dimensions:
                  type: object
                  properties:
                    length: { type: number }
                    width:  { type: number }
                    height: { type: number }
                    unit:   { type: string, enum: [inch, centimeter] }
      responses:
        '200': { description: Rate estimates }
        '422': { description: Validation error }
        '502': { description: ShipEngine API error }

