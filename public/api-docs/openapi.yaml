            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated Instacart orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPlatformOrders"

  /delivery/instacart/orders/{platformOrder}/accept:
    post:
      tags:
        - Instacart Integration
      summary: Accept Instacart order → creates internal order
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  platform_order:
                    $ref: "#/components/schemas/PlatformOrder"

  /delivery/instacart/orders/{platformOrder}/reject:
    post:
      tags:
        - Instacart Integration
      summary: Reject Instacart order
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Order rejected

  /webhooks/delivery/instacart:
    post:
      tags:
        - Instacart Integration
      summary: Instacart webhook receiver
      description: |
        Instacart posts order events here. Configure in Instacart Connect Portal.

        **Handled events:**
        - `order.created` / `order.placed` → creates `PlatformOrder`
        - `order.cancelled` → marks cancelled
        - `fulfillment.delivered` → marks delivered
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Processed

  # ── PLATFORM ORDERS (UNIFIED) ─────────────────────────────────────────────────

  /delivery/platform-orders:
    get:
      tags:
        - Platform Orders
      summary: List all platform orders (all vendors unified)
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
        - name: platform
          in: query
          schema:
            type: string
            enum: [ubereats, instacart, grubhub, skip, doordash]
        - name: status
          in: query
          schema:
            type: string
            enum: [received, accepted, rejected, preparing, ready, picked_up, delivered, cancelled, failed]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          example: "2026-02-01"
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          example: "2026-02-28"
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Paginated platform orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPlatformOrders"

  /delivery/platform-orders/summary:
    get:
      tags:
        - Platform Orders
      summary: Dashboard summary — counts and revenue by platform
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Summary data
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_orders:
                    type: integer
                    example: 3
                  today:
                    type: object
                    properties:
                      orders_today:
                        type: integer
                        example: 12
                      revenue_today:
                        type: number
                        example: 450.00
                      fees_today:
                        type: number
                        example: 45.00
                  by_platform:
                    type: array
                    items:
                      type: object
                      properties:
                        platform:
                          type: string
                        total:
                          type: integer
                        total_payout:
                          type: number
                  by_status:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        total:
                          type: integer

  /delivery/platform-orders/{platformOrder}:
    get:
      tags:
        - Platform Orders
      summary: Platform order detail (with items + linked internal order)
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Platform order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrder"

  /delivery/platform-orders/{platformOrder}/status:
    patch:
      tags:
        - Platform Orders
      summary: Update platform order status (admin)
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [received, accepted, rejected, preparing, ready, picked_up, delivered, cancelled, failed]
                reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Status updated

  # ── DRIVER APP ───────────────────────────────────────────────────────────────

  /driver-app/login:
    post:
      tags:
        - Driver App
      summary: Driver login with phone + PIN
      description: Returns a Bearer token for use in all subsequent Driver App requests.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, pin]
              properties:
                phone:
                  type: string
                  example: "+923001234567"
                pin:
                  type: string
                  example: "1234"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "xxxxxxxx80chars"
                  driver:
                    $ref: "#/components/schemas/DeliveryStaff"
        "401":
          description: Invalid phone or PIN

  /driver-app/me:
    get:
      tags:
        - Driver App
      summary: Get driver profile + current active assignment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile and current assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver:
                    $ref: "#/components/schemas/DeliveryStaff"
                  current_assignment:
                    nullable: true
                    $ref: "#/components/schemas/DeliveryAssignment"

  /driver-app/status:
    patch:
      tags:
        - Driver App
      summary: Go online / offline + update location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [available, busy, offline]
                  example: available
                current_lat:
                  type: number
                  nullable: true
                  example: 33.7294
                current_lng:
                  type: number
                  nullable: true
                  example: 73.0931
      responses:
        "200":
          description: Status updated

  /driver-app/location:
    post:
      tags:
        - Driver App
      summary: Update GPS location (call every 30s while active)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                  example: 33.7294
                lng:
                  type: number
                  example: 73.0931
      responses:
        "200":
          description: Location updated

  /driver-app/assignments:
    get:
      tags:
        - Driver App
      summary: Get active assignments for the logged-in driver
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryAssignment"

  /driver-app/assignments/{assignmentId}/respond:
    patch:
      tags:
        - Driver App
      summary: Accept or reject an assignment
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, reject]
                  example: accept
                rejection_reason:
                  type: string
                  nullable: true
                  example: Too far away
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  assignment:
                    $ref: "#/components/schemas/DeliveryAssignment"

  /driver-app/assignments/{assignmentId}/progress:
    patch:
      tags:
        - Driver App
      summary: Update delivery progress (picked_up / out_for_delivery / delivered / failed)
      description: |
        **Status flow:** `accepted → picked_up → out_for_delivery → delivered`

        Each status update also syncs the parent `Order` status.
        After `delivered`, driver is automatically marked `available`.
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [picked_up, out_for_delivery, delivered, failed]
                  example: picked_up
                driver_notes:
                  type: string
                  nullable: true
                lat:
                  type: number
                  nullable: true
                  description: Current driver GPS lat
                lng:
                  type: number
                  nullable: true
                  description: Current driver GPS lng
      responses:
        "200":
          description: Progress updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  assignment:
                    $ref: "#/components/schemas/DeliveryAssignment"

  /driver-app/history:
    get:
      tags:
        - Driver App
      summary: Driver's completed delivery history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated delivery history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAssignments"

# ── COMPONENTS ────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────────
  # Cal.com Integration
  # ─────────────────────────────────────────────────────────────────────────────

  /api/webhooks/cal/{slug}:
    post:
      tags: [Cal.com]
      summary: Receive Cal.com webhook event
      description: |
        Public — no auth required. Signature verified via HMAC-SHA256 using the
        platform webhook_secret (`X-Cal-Signature-256` header).
        Handles: BOOKING_CREATED, BOOKING_CONFIRMED, BOOKING_RESCHEDULED,
        BOOKING_CANCELLED, MEETING_ENDED.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: my-platform }
        - name: X-Cal-Signature-256
          in: header
          required: true
          schema: { type: string }
          description: HMAC-SHA256 of raw request body with webhook_secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                triggerEvent: { type: string, example: BOOKING_CREATED }
                payload:
                  type: object
                  properties:
                    uid: { type: string }
                    title: { type: string }
                    startTime: { type: string, format: date-time }
                    endTime: { type: string, format: date-time }
                    status: { type: string }
                    attendees:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          email: { type: string }
                          timeZone: { type: string }
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "401":
          description: Invalid signature

