          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category_id:
                  type: integer
                  nullable: true
                business_id:
                  type: integer
                  nullable: true
                slug:
                  type: string
                type:
                  type: string
                is_active:
                  type: boolean
      responses:
        "200":
          description: Updated
    delete:
      tags:
