    patch:
      tags:
        - Discovery Users
      summary: Update discovery user (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                photo:
                  type: string
                audio:
                  type: string
                bio:
                  type: string
      responses:
        "200":
          description: Updated
        "404":
          description: User not found (ID must be numeric)
    delete:
      tags:
        - Discovery Users
      summary: Delete discovery user (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/MessageOk"
        "404":
          description: User not found (ID must be numeric)

  # ── MEDIA UPLOAD ──────────────────────────────────────────────────────────

  /ecommerce/upload:
    post:
      tags:
        - Media Upload
      summary: Upload image, video or audio (max 20MB)
      description: |
        Upload any file. Returns a public URL you can use in
        `image_url`, `audio_url`, or menu item `image` fields.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (max 20MB)
                folder:
                  type: string
                  enum:
                    - businesses
                    - menu-items
                    - discovery-users
                    - ecommerce
                  default: ecommerce
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: http://127.0.0.1:8000/storage/ecommerce/businesses/abc123.jpg
                  path:
                    type: string
                    example: ecommerce/businesses/abc123.jpg

  # ── DATA SOURCE HUB ───────────────────────────────────────────────────────

  /ecommerce/data-sources:
    get:
      tags:
        - Data Source Hub
      summary: List data sources
      responses:
        "200":
          description: List of data sources
    post:
      tags:
        - Data Source Hub
      summary: Create data source
      requestBody:
