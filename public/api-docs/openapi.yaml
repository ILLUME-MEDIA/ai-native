components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumToken
      description: |
        Laravel Sanctum token. Get it via `POST /api/auth/token`.
    siteApiKey:
      type: http
      scheme: bearer
      description: |
        Site API key (`SITE_API_KEY` from .env).
        Use this for public endpoints like `POST /api/register-business`.
    otpBearerAuth:
      type: http
      scheme: bearer
      description: |
        Encrypted OTP auth token returned by `POST /otp-auth/verify` or `POST /otp-auth/complete-profile`.
        This is NOT a Sanctum token — it is a Laravel `encrypt()` string.
        Store it client-side and send as `Authorization: Bearer <token>` to `GET /otp-auth/profile`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Record ID

  responses:
    MessageOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object

  schemas:

    # ── CART ─────────────────────────────────────────────────────────────────

    CartModifierInput:
      type: object
      description: |
        Modifier selection sent by client. Only `option_id` and optional `quantity` — never prices.
      required:
        - option_id
      properties:
        option_id:
          type: integer
          description: ID from modifier_groups[].options[].id
          example: 12
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          default: 1
          description: How many of this modifier option (e.g. Extra Cheese × 2)
          example: 2

    CartModifierSnapshot:
      type: object
      description: |
        Resolved modifier stored in cart — all names and prices from DB, never from client.
        `line_total` = price_adjustment × quantity (convenience field).
      properties:
        group_id:
          type: integer
          example: 2
        group_name:
          type: string
          example: "Toppings"
        option_id:
          type: integer
          example: 12
        option_name:
          type: string
          example: "Extra Cheese"
        price_adjustment:
          type: number
          description: Per-unit price delta from DB (can be negative for discounts)
          example: 1.00
        quantity:
          type: integer
          description: How many of this modifier were selected
          example: 2
        line_total:
          type: number
          description: "price_adjustment × quantity (backend computed)"
          example: 2.00

    CartItem:
      type: object
      properties:
        id:
          type: integer
          example: 42
        session_id:
          type: string
          description: Internal session key (otp_users_5, uuid, or session id)
          example: "otp_users_5"
        business_id:
          type: integer
          example: 3
        menu_item_id:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        notes:
          type: string
          nullable: true
          example: "No onions"
        modifiers:
          type: array
          nullable: true
          description: |
            Resolved modifier snapshot. null if no modifiers selected.
            price_adjustment values are always from DB — never from client.
          items:
            $ref: "#/components/schemas/CartModifierSnapshot"
        menu_item:
          type: object
          description: Loaded menu item (name, base price, etc.)
          properties:
            id:
              type: integer
            name:
              type: string
              example: "Burger"
            price:
              type: number
              example: 10.00
            description:
              type: string
            image:
              type: string
              nullable: true
        business:
          type: object
          description: Loaded business record
          properties:
            id:
              type: integer
            name:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── OTP AUTH ERROR ───────────────────────────────────────────────────────

    OtpAuthError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Human-readable error reason
          example: "Token was issued for a different table. Re-verify with table=discovery_users."
        hint:
          type: string
          example: 'POST /otp-auth/verify with { email, otp, table: "discovery_users" } → use the returned "token" field.'
        code:
          type: string
          description: Machine-readable error code
          enum:
            - no_token
            - invalid_token
            - invalid_token_type
            - wrong_table
            - token_expired
            - user_not_found
            - decrypt_failed
          example: wrong_table

    # ── OTP AUTH ────────────────────────────────────────────────────────────

    OtpVerifyRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        otp:
          type: string
          minLength: 4
          maxLength: 10
          example: "123456"
        table:
          type: string
          description: DB table to check email in
          default: users
          example: discovery_users
        check_email:
          type: boolean
          default: true
          description: Whether to check if email exists in the table
        on_found:
          type: string
          enum:
            - token
            - message
          default: token
          description: What to return when email is found
        on_not_found:
          type: string
          enum:
            - token
            - message
            - profile
            - create
          default: profile
          description: |
            What to return when email is NOT found:
            - `token` — issue token anyway (OTP-only auth)
            - `message` — return message only
            - `profile` — return otp_token for complete-profile flow
            - `create` — auto-create user record and return token
        found_message:
          type: string
          description: Custom success message when email is found
        not_found_message:
          type: string
          description: Custom message when email is not found
        create_data:
          type: object
          description: Extra fields to insert when on_not_found=create
        skip_token:
          type: boolean
          default: false
          description: Return user data without a token (on_found=token ignored)
        device_info:
          type: object
          description: Device/location fingerprint — captured into discovery_users table
          properties:
            fingerprint:
              type: string
            browser:
              type: string
            os:
              type: string
            device_type:
              type: string
              example: mobile
            timezone:
              type: string
              example: America/New_York
            lat:
              type: number
              format: float
            lng:
              type: number
              format: float
            city:
              type: string
            country:
              type: string
            country_code:
              type: string
              example: US

    OtpVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - authenticated
            - profile_incomplete
            - not_found
            - created
            - otp_verified
        message:
          type: string
          example: Welcome back!
        token:
          type: string
          description: Encrypted auth token (present for authenticated/created/otp_verified)
        otp_token:
          type: string
          description: Short-lived session token (present when status=profile_incomplete)
        email:
          type: string
          format: email
        user:
          type: object
          description: User row from DB table (password removed)

    OtpSettings:
      type: object
      properties:
        allowed_tables:
          type: array
          items:
            type: string
          example:
            - users
            - discovery_users
        table_options:
          type: object
          description: Per-table verify behavior overrides
        resend_configured:
          type: boolean
        from_email:
          type: string
          format: email
        from_name:
          type: string
        otp_length:
          type: integer
          example: 6
        otp_expires_minutes:
          type: integer
          example: 10
        max_attempts:
          type: integer
          example: 5
        resend_cooldown:
          type: integer
          example: 60
          description: Seconds to wait before resending OTP
        token_expires_days:
          type: integer
          example: 30

    OtpTableOptions:
      type: object
      description: Per-table default behavior for OTP verify
      properties:
        check_email:
          type: boolean
          default: true
        on_found:
          type: string
          enum:
            - token
            - message
        on_not_found:
          type: string
          enum:
            - token
            - message
            - profile
            - create
        skip_token:
          type: boolean
        found_message:
          type: string
        not_found_message:
          type: string

    # ── GENERAL ─────────────────────────────────────────────────────────────

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    BusinessRegistrationSubmit:
      type: object
      required:
        - business_name
        - contact_name
        - contact_email
        - agreement_accepted
        - signature_name
      properties:
        business_name:
          type: string
          example: My Halal Restaurant
        address:
          type: string
        address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
          default: US
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        website_url:
          type: string
          format: uri
        menu_url:
