  # ── DELIVERY ZONES ───────────────────────────────────────────────────────────

  /delivery/zones:
    get:
      tags:
        - Delivery Zones
      summary: List delivery zones
      security: []
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryZone"
    post:
      tags:
        - Delivery Zones
      summary: Create delivery zone (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneInput"
      responses:
        "201":
          description: Zone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"

  /delivery/zones/check-point:
    get:
      tags:
        - Delivery Zones
      summary: Check if a lat/lng is within any delivery zone (public)
      description: Use from storefront to show delivery fee before checkout.
      security: []
      parameters:
        - name: business_id
          in: query
          required: true
          schema:
            type: integer
        - name: lat
          in: query
          required: true
          schema:
            type: number
          example: 33.7294
        - name: lng
          in: query
          required: true
          schema:
            type: number
          example: 73.0931
      responses:
        "200":
          description: Zone check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  in_zone:
                    type: boolean
                    example: true
                  zone:
                    $ref: "#/components/schemas/DeliveryZone"
                  delivery_fee:
                    type: number
                    example: 2.99
                  estimated_minutes:
                    type: integer
                    example: 25
                  message:
                    type: string
                    nullable: true
                    example: No delivery zone covers your location.

  /delivery/zones/reorder:
    post:
      tags:
        - Delivery Zones
      summary: Reorder zones (drag-and-drop from admin UI)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items:
                    type: integer
