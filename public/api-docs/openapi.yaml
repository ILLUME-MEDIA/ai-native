        - name: country_code
          in: query
          schema:
            type: string
            example: US
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Paginated discovery users with location

  /ecommerce/discovery-users/{id}:
    get:
      tags:
        - Discovery Users
      summary: Get discovery user detail (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
