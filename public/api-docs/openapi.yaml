          description: List of data sources
    post:
      tags:
        - Data Source Hub
      summary: Create data source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceInput"
            examples:
              local_table:
                summary: Local DB Table (e.g. muzzhub)
                value:
                  name: Muzzhub
                  type: local_table
                  is_active: true
                  config:
                    table: muzzhub
                    field_map:
                      title: name
                      address: address
              rest_api:
                summary: REST API source
                value:
                  name: Pakistan Hub API
                  type: api
                  is_active: true
                  config:
                    base_url: https://pakistanhub.com
                    endpoint: /api/businesses
                    auth_type: bearer
                    token: your-api-token
                    per_page: 50
                    data_key: data
      responses:
        "201":
          description: Created

  /ecommerce/data-sources/{id}:
    get:
      tags:
        - Data Source Hub
      summary: Get data source detail
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Data source detail with logs
    patch:
      tags:
        - Data Source Hub
      summary: Update data source
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceInput"
      responses:
        "200":
          description: Updated
    delete:
      tags:
        - Data Source Hub
      summary: Delete data source
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/MessageOk"

  /ecommerce/data-sources/{id}/sync:
    post:
      tags:
        - Data Source Hub
      summary: Trigger sync for a data source
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  imported:
                    type: integer
                  skipped:
                    type: integer
                  failed:
                    type: integer
                  duration_ms:
                    type: integer
        "409":
          description: Sync already in progress

  /ecommerce/data-sources/{id}/logs:
    get:
      tags:
        - Data Source Hub
      summary: Get last 20 sync logs
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sync logs

  # ── STRIPE PAYMENTS ───────────────────────────────────────────────────────

  /payment/stripe/setup-intent:
    post:
      tags:
        - Stripe Payments
      summary: Step 1 — Create SetupIntent (to save card without charging)
      description: |
        Creates a Stripe SetupIntent. Use the returned `client_secret` on the frontend
        with `stripe.confirmCardSetup()` to securely collect and confirm the card.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: SetupIntent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  client_secret:
                    type: string
                    example: seti_1...secret_...
                    description: Pass this to stripe.confirmCardSetup() on the frontend
                  stripe_customer_id:
                    type: string
                    example: cus_abc123
        "401":
          description: OTP token missing or expired

  /payment/stripe/save-method:
    post:
      tags:
        - Stripe Payments
      summary: Step 2 — Save payment method after confirmCardSetup
      description: |
        After the frontend calls `stripe.confirmCardSetup()` and gets a `payment_method` id,
        call this endpoint to attach it to the customer and save it in the database.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_method_id
              properties:
                payment_method_id:
                  type: string
                  example: pm_1ABC...
                  description: The payment_method id from Stripe (starts with pm_)
                set_default:
                  type: boolean
                  default: false
                  description: Whether to set this as the default payment method
            example:
              payment_method_id: pm_1ABC...
              set_default: true
      responses:
        "201":
          description: Payment method saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_method:
                    $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired
        "422":
          description: Validation error

  /payment/stripe/methods:
    get:
      tags:
        - Stripe Payments
      summary: List saved payment methods
      description: |
        Returns all saved cards for the authenticated user.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: List of saved payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_methods:
                    type: array
                    items:
                      $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired

  /payment/stripe/methods/{id}:
    delete:
      tags:
        - Stripe Payments
      summary: Delete a saved payment method
      description: |
        Detaches the payment method from Stripe and removes it from the database.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Local DB id of the payment method (from list response)
      responses:
        "200":
          description: Payment method removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment method removed.
        "401":
          description: OTP token missing or expired
        "404":
          description: Payment method not found or does not belong to this user

  /payment/stripe/methods/{id}/set-default:
    post:
      tags:
        - Stripe Payments
      summary: Set a payment method as default
      description: |
        Marks the specified payment method as the default for future charges.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Local DB id of the payment method
      responses:
        "200":
          description: Default updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_method:
                    $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired
        "404":
          description: Payment method not found

  /payment/stripe/charge:
    post:
      tags:
        - Stripe Payments
      summary: Charge a saved card for an order
      description: |
        Charges the customer's saved card for an existing order.
        Uses the default payment method unless `payment_method_id` is specified.

        On success, the order's `payment_status` is set to `paid`.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
              properties:
                order_id:
                  type: integer
                  description: ID of the order to charge
                  example: 42
                payment_method_id:
                  type: string
                  description: Stripe pm_ id to use (optional — uses default if omitted)
                  example: pm_1ABC...
            example:
              order_id: 42
      responses:
        "200":
          description: Charge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_status:
                    type: string
                    enum:
                      - paid
                      - failed
                  payment_intent_id:
                    type: string
                    example: pi_1ABC...
                  amount_charged:
                    type: number
                    example: 29.99
                  order_number:
                    type: string
                    example: ORD-A1B2C3D4
        "401":
          description: OTP token missing or expired
        "409":
          description: Order is already paid
        "422":
          description: No saved payment method found — save a card first

  /payment/stripe/webhook:
    post:
      tags:
        - Stripe Payments
      summary: Stripe webhook receiver
      description: |
        Stripe sends payment events to this endpoint.
        Configure this URL in your **Stripe Dashboard → Developers → Webhooks**.

        **Supported events:**
        - `payment_intent.succeeded` → sets order `payment_status` to `paid`
        - `payment_intent.payment_failed` → sets order `payment_status` to `failed`

        Requires `STRIPE_WEBHOOK_SECRET` in `.env` for signature verification.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Stripe webhook signature header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload
      responses:
        "200":
          description: Event processed
        "400":
          description: Invalid signature or malformed event

  # ── DOORDASH ────────────────────────────────────────────────────────────────

  \delivery\doordash\status\{order}:
    get:
      tags:
        - DoorDash Delivery
      summary: Get live delivery status
      description: |
        Fetches the current delivery status from DoorDash and syncs it to the local order.
        Also updates the order status (`out_for_delivery`, `delivered`, `cancelled`) automatically.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "200":
          description: Delivery status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  order_number:
                    type: string
                    example: ORD-ABC12345
                  dd_status:
                    type: string
                    example: enroute_to_pickup
                  dd_label:
                    type: string
                    example: Dasher Heading to Restaurant
                  tracking_url:
                    type: string
                    nullable: true
                    example: https://doordash.com/track/...
                  delivery:
                    type: object
                    description: Full DoorDash delivery object
        "404":
          description: No DoorDash delivery for this order
        "502":
          description: DoorDash API error

  \delivery\doordash\dispatch\{order}:
    post:
      tags:
        - DoorDash Delivery
      summary: Manually dispatch a DoorDash delivery
      description: |
        Manually creates a DoorDash delivery for an order. Useful when auto-dispatch failed
        at order creation time. Returns 409 if a delivery was already dispatched.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "201":
          description: Delivery dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  delivery_id:
                    type: string
                    example: ORD-ABC12345
                  status:
                    type: string
                    example: created
                  label:
                    type: string
                    example: Order Received
                  tracking_url:
                    type: string
                    nullable: true
        "409":
          description: DoorDash delivery already exists for this order
        "422":
          description: Order has no delivery address
        "502":
          description: DoorDash API error

  \delivery\doordash\cancel\{order}:
    post:
      tags:
        - DoorDash Delivery
      summary: Cancel a DoorDash delivery
      description: |
        Cancels an active DoorDash delivery and sets the order status to `cancelled`.
        Returns 409 if the delivery is already completed or cancelled.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "200":
          description: Delivery cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: DoorDash delivery cancelled.
        "404":
          description: No DoorDash delivery for this order
        "409":
          description: Delivery cannot be cancelled (already delivered / cancelled)
        "502":
          description: DoorDash API error

  \delivery\doordash\webhook:
    post:
      tags:
        - DoorDash Delivery
      summary: DoorDash webhook receiver
      description: |
        DoorDash sends delivery status updates to this endpoint.
        Configure this URL in the **DoorDash Developer Portal → Webhooks**.

        **Status mappings:**
        | DoorDash status | Order status |
        |---|---|
        | `enroute_to_pickup` | `preparing` |
        | `arrived_at_pickup` | `ready` |
        | `picked_up` / `enroute_to_dropoff` | `out_for_delivery` |
        | `delivered` | `delivered` |
        | `delivery_cancelled` / `returned` | `cancelled` |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_delivery_id:
                  type: string
                  example: ORD-ABC12345
                  description: Matches the order_number
                delivery_status:
                  type: string
                  example: picked_up
                tracking_url:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Webhook processed

# ── COMPONENTS ────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumToken
      description: |
        Laravel Sanctum token. Get it via `POST /api/auth/token`.
    siteApiKey:
      type: http
      scheme: bearer
      description: |
        Site API key (`SITE_API_KEY` from .env).
        Use this for public endpoints like `POST /api/register-business`.
    otpBearerAuth:
      type: http
      scheme: bearer
      description: |
        Encrypted OTP auth token returned by `POST /otp-auth/verify` or `POST /otp-auth/complete-profile`.
        This is NOT a Sanctum token — it is a Laravel `encrypt()` string.
        Store it client-side and send as `Authorization: Bearer <token>` to `GET /otp-auth/profile`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Record ID

  responses:
    MessageOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object

  schemas:

    # ── OTP AUTH ────────────────────────────────────────────────────────────

    OtpVerifyRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        otp:
          type: string
          minLength: 4
          maxLength: 10
          example: "123456"
        table:
          type: string
          description: DB table to check email in
          default: users
          example: discovery_users
        check_email:
          type: boolean
          default: true
          description: Whether to check if email exists in the table
        on_found:
          type: string
          enum:
            - token
            - message
          default: token
          description: What to return when email is found
        on_not_found:
          type: string
          enum:
            - token
            - message
            - profile
            - create
          default: profile
          description: |
            What to return when email is NOT found:
            - `token` — issue token anyway (OTP-only auth)
            - `message` — return message only
            - `profile` — return otp_token for complete-profile flow
            - `create` — auto-create user record and return token
        found_message:
          type: string
          description: Custom success message when email is found
        not_found_message:
          type: string
          description: Custom message when email is not found
        create_data:
          type: object
          description: Extra fields to insert when on_not_found=create
        skip_token:
          type: boolean
          default: false
          description: Return user data without a token (on_found=token ignored)
        device_info:
          type: object
          description: Device/location fingerprint — captured into discovery_users table
          properties:
            fingerprint:
              type: string
            browser:
              type: string
            os:
              type: string
            device_type:
              type: string
              example: mobile
            timezone:
              type: string
              example: America/New_York
            lat:
              type: number
              format: float
            lng:
              type: number
              format: float
            city:
              type: string
            country:
              type: string
            country_code:
              type: string
              example: US

    OtpVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - authenticated
            - profile_incomplete
            - not_found
            - created
            - otp_verified
        message:
          type: string
          example: Welcome back!
        token:
          type: string
          description: Encrypted auth token (present for authenticated/created/otp_verified)
        otp_token:
          type: string
          description: Short-lived session token (present when status=profile_incomplete)
        email:
          type: string
          format: email
        user:
          type: object
          description: User row from DB table (password removed)

    OtpSettings:
      type: object
      properties:
        allowed_tables:
          type: array
          items:
            type: string
          example:
            - users
            - discovery_users
        table_options:
          type: object
          description: Per-table verify behavior overrides
        resend_configured:
          type: boolean
        from_email:
          type: string
          format: email
        from_name:
          type: string
        otp_length:
          type: integer
          example: 6
        otp_expires_minutes:
          type: integer
          example: 10
        max_attempts:
          type: integer
          example: 5
        resend_cooldown:
          type: integer
          example: 60
          description: Seconds to wait before resending OTP
        token_expires_days:
          type: integer
          example: 30

    OtpTableOptions:
      type: object
      description: Per-table default behavior for OTP verify
      properties:
        check_email:
          type: boolean
          default: true
        on_found:
          type: string
          enum:
            - token
            - message
        on_not_found:
          type: string
          enum:
            - token
            - message
            - profile
            - create
        skip_token:
          type: boolean
        found_message:
          type: string
        not_found_message:
          type: string

    # ── GENERAL ─────────────────────────────────────────────────────────────

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    BusinessRegistrationSubmit:
      type: object
      required:
        - business_name
        - contact_name
        - contact_email
        - agreement_accepted
        - signature_name
      properties:
        business_name:
          type: string
          example: My Halal Restaurant
        address:
          type: string
        address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
          default: US
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        website_url:
          type: string
          format: uri
        menu_url:
          type: string
          format: uri
        external_site_url:
          type: string
          format: uri
          description: URL on external site where this business should appear after approval
        monday_open:
          type: string
          example: "09:00"
        monday_close:
          type: string
          example: "22:00"
        tuesday_open:
          type: string
        tuesday_close:
          type: string
        wednesday_open:
          type: string
        wednesday_close:
          type: string
        thursday_open:
          type: string
        thursday_close:
          type: string
        friday_open:
          type: string
        friday_close:
          type: string
        saturday_open:
          type: string
        saturday_close:
          type: string
        sunday_open:
          type: string
        sunday_close:
          type: string
        bio:
          type: string
        image_url:
          type: string
          description: URL returned by POST /api/ecommerce/upload
        audio_url:
          type: string
          description: URL returned by POST /api/ecommerce/upload
        agreement_accepted:
          type: boolean
          enum:
            - true
        signature_name:
          type: string
        signature_data:
          type: string
          description: Base64-encoded PNG from signature canvas
        target_source:
          type: string
          enum:
            - businesses
            - muzzhub
            - pakistanhub
          default: businesses
          description: |
            Target platform for this registration.
            - `businesses` — general/main platform
            - `muzzhub` — MuzzHub US halal restaurant directory
            - `pakistanhub` — PakistanHub Pakistani restaurant directory
          example: muzzhub

    BusinessRegistration:
      allOf:
        - $ref: "#/components/schemas/BusinessRegistrationSubmit"
        - type: object
          properties:
            id:
              type: integer
            status:
              type: string
              enum:
                - pending
                - approved
                - rejected
            target_source:
              type: string
              enum:
                - businesses
                - muzzhub
                - pakistanhub
              description: Target platform this registration is for
            rejection_reason:
              type: string
            business_id:
              type: integer
              description: Set after approval — links to the created Business
            ip_address:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    PaginatedRegistrations:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BusinessRegistration"
        total:
          type: integer
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer

    BusinessInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        category_id:
          type: integer
        description:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        logo:
          type: string
        is_active:
          type: boolean
          default: true

    DataSourceInput:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - local_table
            - api
        config:
          type: object
          description: |
            local_table: `{"table":"muzzhub","field_map":{...}}`
            api: `{"base_url":"https://...","endpoint":"/api/businesses","auth_type":"bearer","token":"..."}`
        is_active:
          type: boolean
          default: true

    # ── STRIPE ────────────────────────────────────────────────────────────────

    StripePaymentMethod:
      type: object
      properties:
        id:
          type: integer
          description: Local DB id — use this in delete / set-default endpoints
          example: 3
        stripe_pm_id:
          type: string
          description: Stripe PaymentMethod id
          example: pm_1ABC...
        brand:
          type: string
          example: visa
        last4:
          type: string
          example: "4242"
        exp_month:
          type: integer
          example: 12
        exp_year:
          type: integer
          example: 2027
        cardholder_name:
          type: string
          example: John Doe
        is_default:
          type: boolean
          example: true
