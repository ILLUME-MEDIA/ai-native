  # ── UNIFIED CHECKOUT ──────────────────────────────────────────────────────

  /ecommerce/checkout:
    post:
      tags:
        - Checkout
      summary: Unified checkout (single API call)
      description: |
        Complete checkout in **one request** — replaces the multi-step flow of:
        cart → orders → stripe/charge.

        **Session identification (pick one):**

        | Header | When to use |
        |--------|-------------|
        | `X-Session-Id: <uuid>` | Guest checkout — any UUID |
        | `Authorization: Bearer <otp-token>` | Logged-in user (OTP) — uses same cart + saved card |

        **Payment options:**

        | `payment_method` | Required fields | Behaviour |
        |------------------|-----------------|-----------|
        | `cod` (default) | none | Order created, payment collected on delivery |
        | `stripe` + `stripe_payment_method_id` | `pm_...` id from Stripe.js | One-time charge — no account needed |
        | `stripe` + OTP Bearer token | saved card in account | Charges default saved card |

        **Item source:**
        - `items[]` in body → external site / app (no session cart needed)
        - Omit `items[]` → uses session cart (same X-Session-Id used for cart)

        **Customer info auto-fill (OTP Bearer token):**
        When `Authorization: Bearer <otp-token>` is present, `customer_name`, `customer_email`,
        and `customer_phone` are automatically resolved from the `discovery_users` record.
        Any value you pass in the request **overrides** the token data.
        Without a token, `customer_name` and `customer_email` are required.
      security: []
      parameters:
        - name: X-Session-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Guest session UUID — any UUID works for external sites
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OTP Bearer token — for saved card payment or linked cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - business_id
              properties:
                business_id:
                  type: integer
                  example: 1
                customer_name:
                  type: string
                  nullable: true
                  description: "Required if no OTP Bearer token. Auto-filled from discovery_users when token is present."
                  example: "Jane Doe"
                customer_email:
                  type: string
                  format: email
                  nullable: true
                  description: "Required if no OTP Bearer token. Auto-filled from discovery_users when token is present."
                  example: "jane@example.com"
                customer_phone:
                  type: string
                  nullable: true
                  description: "Optional. Auto-filled from discovery_users when OTP Bearer token is present."
                  example: "+1 310 555 0100"
                order_type:
                  type: string
                  enum: [delivery, pickup, dine_in]
                  default: delivery
                delivery_address:
                  type: string
                  nullable: true
                  example: "456 Oak Ave, Los Angeles, CA 90001"
                delivery_vendor:
                  type: string
                  nullable: true
                  description: doordash | ubereats | instacart | own | blank for in-house
                  example: "doordash"
                delivery_fee:
                  type: number
                  description: Delivery fee in dollars. Use POST /api/delivery/quote to get the real fee first.
                  example: 5.99
                tax_rate:
                  type: number
                  description: Tax percentage (e.g. 10 = 10%)
                  example: 10
                notes:
                  type: string
                  nullable: true
                  example: "Ring doorbell"
                items:
                  type: array
                  nullable: true
                  description: |
                    Pass items directly — no session cart needed (for external sites).
                    Omit to use the session cart instead.
                  items:
                    type: object
                    required:
                      - menu_item_id
                    properties:
                      menu_item_id:
                        type: integer
                        example: 5
                      quantity:
                        type: integer
                        default: 1
                        example: 2
                      notes:
                        type: string
                        nullable: true
                        example: "no onions"
                      modifiers:
                        type: array
                        nullable: true
                        items:
                          type: object
                          required:
                            - option_id
                          properties:
                            option_id:
                              type: integer
                              example: 3
                            quantity:
                              type: integer
                              default: 1
                tip_type:
                  type: string
                  nullable: true
                  enum: [none, percentage, fixed]
                  description: How to calculate the tip. `percentage` = % of subtotal, `fixed` = flat dollar amount.
                  example: percentage
                tip_value:
                  type: number
                  nullable: true
                  description: Tip amount (percent if `tip_type=percentage`, dollars if `tip_type=fixed`)
                  example: 15
                payment_method:
                  type: string
                  enum: [cod, stripe]
                  default: cod
                  description: "`cod` = Cash on Delivery. `stripe` = card payment (requires `stripe_payment_method_id` or OTP Bearer token)."
                stripe_payment_method_id:
                  type: string
                  nullable: true
                  description: |
                    Stripe `pm_...` id from `stripe.createPaymentMethod()` or `stripe.confirmCardSetup()` on the frontend.
                    Required when `payment_method: stripe` and user has no saved card.
                  example: "pm_1ABC..."
            examples:
              external_cod:
                summary: External site — COD with inline items
                value:
                  business_id: 1
                  customer_name: "Jane Doe"
                  customer_email: "jane@example.com"
                  customer_phone: "+1 310 555 0100"
                  order_type: delivery
                  delivery_address: "456 Oak Ave, LA, CA 90001"
                  delivery_fee: 3.99
                  tax_rate: 10
                  items:
                    - menu_item_id: 5
                      quantity: 2
                    - menu_item_id: 8
                      quantity: 1
                      modifiers:
                        - option_id: 3
              external_stripe:
                summary: External site — Stripe card payment
                value:
                  business_id: 1
                  customer_name: "Jane Doe"
                  customer_email: "jane@example.com"
                  customer_phone: "+1 310 555 0100"
                  order_type: delivery
                  delivery_address: "456 Oak Ave, LA, CA 90001"
                  delivery_vendor: doordash
                  delivery_fee: 5.99
                  tax_rate: 10
                  items:
                    - menu_item_id: 5
                      quantity: 1
                  payment_method: stripe
                  stripe_payment_method_id: "pm_1ABC..."
              session_cart:
                summary: Session cart — COD (same as checkout page)
                value:
                  business_id: 1
                  customer_name: "John Doe"
                  customer_email: "john@example.com"
                  customer_phone: "+1 310 555 0101"
                  order_type: delivery
                  delivery_address: "123 Main St, LA, CA 90012"
                  tax_rate: 10
                  delivery_fee: 3.99
                  payment_method: cod
              otp_token_autofill:
                summary: OTP Bearer token — customer info auto-filled from discovery_users
                value:
                  business_id: 1
                  order_type: delivery
                  delivery_address: "456 Oak Ave, LA, CA 90001"
                  delivery_fee: 3.99
                  tax_rate: 10
                  items:
                    - menu_item_id: 5
                      quantity: 2
      responses:
        "201":
          description: Order placed (and paid if Stripe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  order:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                      order_number:
                        type: string
                        example: ORD-A1B2C3D4
                      status:
                        type: string
                        example: pending
                      payment_status:
                        type: string
                        enum: [unpaid, paid, failed]
                        example: paid
                      subtotal:
                        type: number
                        example: 24.99
                      tax:
                        type: number
                        example: 2.50
                      delivery_fee:
                        type: number
                        example: 5.99
                      platform_fee:
                        type: number
                        example: 1.00
                        description: Platform service fee (calculated server-side from business config)
                      tip:
                        type: number
                        example: 3.75
                        description: Tip amount (calculated from tip_type + tip_value)
                      total:
                        type: number
                        example: 33.48
                      tracking_url:
                        type: string
                        nullable: true
                        description: DoorDash tracking URL (if auto-dispatched)
                      items:
                        type: array
                        items:
                          type: object
        "402":
          description: Payment failed — order was created but payment_status is `failed`
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Payment failed: Your card was declined."
                  order:
                    type: object
                    description: The order that was created (use order.id to retry payment)
        "401":
          description: Stripe payment requires stripe_payment_method_id or OTP Bearer token
        "422":
          description: Cart empty / no valid items / validation error

  # ── POS CHECKOUT ──────────────────────────────────────────────────────────

  /ecommerce/pos/{connection}/devices:
    get:
      tags:
        - POS Checkout
      summary: List POS terminal devices
      description: Returns available Square terminal devices for a POS connection.
      parameters:
        - name: connection
          in: path
          required: true
          schema:
            type: integer
          description: POS connection ID
      responses:
        "200":
          description: List of terminal devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
        "422":
          description: Device list only available for Square

  /ecommerce/pos/{connection}/checkout:
    post:
      tags:
        - POS Checkout
      summary: Create terminal checkout
      description: |
        Creates an order in the POS system (Square/Clover) and initiates a terminal checkout.
        The terminal prompts the customer to pay.

        Poll `GET /ecommerce/pos/{connection}/checkout/{checkoutId}/status` to watch for `COMPLETED`.

        For **Square**: a terminal checkout is created and sent to the specified device.
        For **Clover**: a Clover order is created.
      parameters:
        - name: connection
          in: path
          required: true
          schema:
            type: integer
          description: POS connection ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
              properties:
                order_id:
                  type: integer
                  description: Local order ID from POST /ecommerce/orders
                  example: 42
                device_id:
                  type: string
                  nullable: true
                  description: Square terminal device ID (from GET /devices). Uses default device if omitted.
                  example: "device_9V3BQVQ3ZBN7E"
      responses:
        "200":
          description: Checkout created — use checkout_id to poll status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  checkout_id:
                    type: string
                    description: Square terminal checkout ID or Clover order ID
                    example: "LtQCGz9K9MXMSP3J"
                  status:
                    type: string
                    example: PENDING
                  provider:
                    type: string
                    enum: [square, clover]
                    example: square
        "422":
          description: POS connection inactive or unsupported provider

  /ecommerce/pos/{connection}/checkout/{checkoutId}/status:
    get:
      tags:
        - POS Checkout
      summary: Poll checkout status
      description: |
        Returns the current status of a Square terminal checkout.

        | Status | Meaning |
        |--------|---------|
        | `PENDING` | Waiting for customer |
        | `IN_PROGRESS` | Customer is interacting with terminal |
        | `COMPLETED` | Payment successful — order marked paid |
        | `CANCELED` | Checkout was cancelled |
        | `CANCEL_REQUESTED` | Cancellation in progress |

        **Note:** Only available for Square. Clover uses webhooks.
      parameters:
        - name: connection
          in: path
          required: true
          schema:
            type: integer
        - name: checkoutId
          in: path
          required: true
          schema:
            type: string
          description: Square terminal checkout ID from POST /checkout
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [PENDING, IN_PROGRESS, COMPLETED, CANCELED, CANCEL_REQUESTED]
                    example: COMPLETED
                  payment_id:
                    type: string
                    nullable: true
                    description: Square payment ID once completed
                    example: "TWnU7MCRxRKzZuRQz9vhZbwV"
        "422":
          description: Status polling only available for Square

  /ecommerce/pos/{connection}/checkout/{checkoutId}/cancel:
    post:
      tags:
        - POS Checkout
      summary: Cancel terminal checkout
      description: Cancels an active Square terminal checkout. Only available for Square.
      parameters:
        - name: connection
          in: path
          required: true
          schema:
            type: integer
        - name: checkoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: CANCEL_REQUESTED

  /ecommerce/pos/{connection}/pay:
    post:
      tags:
        - POS Checkout
      summary: Direct Square payment (card on file / nonce)
      description: |
        Charge a Square payment nonce or card-on-file for a local order.
        Use this for API-based payments (not terminal). For terminal payments, use `POST /checkout`.
      parameters:
        - name: connection
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
                - source_id
              properties:
                order_id:
                  type: integer
                  example: 42
                source_id:
                  type: string
                  description: Square payment nonce or card-on-file token
                  example: "cnon:card-nonce-ok"
      responses:
        "200":
          description: Payment successful — order marked paid

  /ecommerce/orders/{order}/pos-orders:
    get:
      tags:
        - POS Checkout
      summary: Get POS orders for a local order
      description: |
        Returns all POS system orders (Square/Clover) linked to a local order.
        Useful for reconciliation and receipt lookup.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "200":
          description: List of POS orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    order_id:
                      type: integer
                    provider:
                      type: string
                      enum: [square, clover]
                    pos_order_id:
                      type: string
                    pos_payment_id:
                      type: string
                      nullable: true
                    amount:
                      type: number
                    status:
                      type: string
                    created_at:
                      type: string
                      format: date-time

  # ── DISCOVERY USERS (Self-Service — OTP Bearer token) ─────────────────────
  #
  # How to get the token:
  #   POST /api/otp-auth/verify  { email, otp, table: "discovery_users" }
  #   → use the "token" field from the response as Bearer token
  #
  # 401 error codes returned by all self-service endpoints:
  #   no_token          — Authorization header missing
  #   invalid_token     — Token is malformed / missing fields
  #   invalid_token_type — Used an otp_session token instead of otp_auth token
  #   wrong_table       — Token was issued for a different table (e.g. "users")
  #   token_expired     — Token has expired (30-day TTL); re-verify OTP
  #   user_not_found    — User record deleted after token was issued
  #   decrypt_failed    — APP_KEY mismatch or tampered token

  /ecommerce/discovery-users/me:
    get:
      tags:
        - Discovery Users
      summary: Get my profile (OTP auth)
      description: |
        Returns the authenticated discovery user's profile including location.

        **How to get token:**
        ```
        POST /api/otp-auth/verify
        { "email": "user@example.com", "otp": "123456", "table": "discovery_users" }
        ```
        Use the **`token`** field from the response (not `otp_token` — that is a different flow).

        **Auth:** `Authorization: Bearer <token>`
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: Authenticated user profile with location
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: "#/components/schemas/DiscoveryUser"
        "401":
          description: Token missing, invalid, wrong table, expired, or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpAuthError"
    patch:
      tags:
        - Discovery Users
      summary: Update my profile (OTP auth)
      description: |
        Updates the authenticated user's basic profile fields.

        **Auth:** `Authorization: Bearer <otp-token>` (table: discovery_users)
      security:
        - otpBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Ali Hassan
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  example: "+1-555-0100"
                photo:
                  type: string
                  description: URL from POST /ecommerce/upload
                audio:
                  type: string
                  description: URL from POST /ecommerce/upload
                bio:
                  type: string
      responses:
        "200":
          description: Updated profile with location
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/DiscoveryUser"
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpAuthError"

  /ecommerce/discovery-users/me/location:
    get:
      tags:
        - Discovery Users
      summary: Get my location/address (OTP auth)
      description: |
        Returns the authenticated user's saved location record.
        Returns `null` if no location has been set yet.

        **Auth:** `Authorization: Bearer <otp-token>` (table: discovery_users)
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: Location record (or null if not set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  location:
                    nullable: true
                    $ref: "#/components/schemas/DiscoveryUserLocation"
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpAuthError"
    post:
      tags:
        - Discovery Users
      summary: Save my location (OTP auth)
      description: |
        Creates the authenticated user's location record.
        Safe to call even if a location already exists — behaves as upsert.
        All fields are optional — send only what you have.

        **Auth:** `Authorization: Bearer <otp-token>` (table: discovery_users)

        Returns the **complete** saved location object (all fields, including nulls).
        `201` on first save, `200` if location already existed.

        ### Typical GPS save flow
        1. User grants location permission in browser/app
        2. Get coords via `navigator.geolocation.getCurrentPosition()`
        3. Call this endpoint with `lat`, `lng`, `location_from_gps: true`
        4. Optionally reverse-geocode to fill `address`, `city`, `country` fields
      security:
        - otpBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryUserLocationInput"
            examples:
              gps_only:
                summary: GPS coordinates only
                value:
                  lat: 40.7128
                  lng: -74.0060
                  location_from_gps: true
              full_address:
                summary: Full address with GPS
                value:
                  lat: 40.7128
                  lng: -74.0060
                  address: "123 Main St"
                  city: "New York"
                  state: "NY"
                  zip: "10001"
                  country: "United States"
                  country_code: "US"
                  location_from_gps: true
      responses:
        "201":
          description: Location created (first time)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  location:
                    $ref: "#/components/schemas/DiscoveryUserLocation"
        "200":
          description: Location already existed — updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  location:
                    $ref: "#/components/schemas/DiscoveryUserLocation"
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpAuthError"
        "422":
          $ref: "#/components/responses/ValidationError"

    put:
      tags:
        - Discovery Users
      summary: Save/update my location (OTP auth)
      description: |
        Creates or updates the authenticated user's location record (upsert).
        All fields are optional — send only what you have.

        **Auth:** `Authorization: Bearer <otp-token>` (table: discovery_users)

        Returns the **complete** saved location object (all fields, including nulls).
        `201` on first save, `200` on subsequent updates.

        ### Typical GPS save flow
        1. User grants location permission in browser/app
        2. Get coords via `navigator.geolocation.getCurrentPosition()`
        3. Call this endpoint with `lat`, `lng`, `location_from_gps: true`
        4. Optionally reverse-geocode to fill `address`, `city`, `country` fields
      security:
        - otpBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryUserLocationInput"
            examples:
              gps_only:
                summary: GPS coordinates only
                value:
                  lat: 40.7128
                  lng: -74.0060
                  location_from_gps: true
              full_address:
                summary: Full address with GPS
                value:
                  lat: 40.7128
                  lng: -74.0060
                  address: "123 Main St"
                  city: "New York"
                  state: "NY"
                  zip: "10001"
                  country: "United States"
                  country_code: "US"
                  location_from_gps: true
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  location:
                    $ref: "#/components/schemas/DiscoveryUserLocation"
        "201":
          description: Location created (first time)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  location:
                    $ref: "#/components/schemas/DiscoveryUserLocation"
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpAuthError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Discovery Users
      summary: Delete my location (OTP auth)
      description: |
        Removes the authenticated user's location record entirely.

        **Auth:** `Authorization: Bearer <otp-token>` (table: discovery_users)
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: Location removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Location removed.
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpAuthError"

  # ── DISCOVERY USERS (Admin — Sanctum) ─────────────────────────────────────
  # Note: {id} must be a numeric integer. String slugs like "me" are rejected
  # at the route level (->where('[0-9]+')) and will return 404.

  /ecommerce/discovery-users:
