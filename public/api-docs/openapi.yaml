        base_url: { type: string, example: "https://api.cal.com/v2" }
        color: { type: string, example: "#6366f1" }
        is_active: { type: boolean, default: true }

    CalMeeting:
      type: object
      properties:
        id: { type: integer }
        cal_platform_id: { type: integer }
        openorg_user_id: { type: integer, nullable: true, description: "Linked OpenOrg user" }
        booking_uid: { type: string, nullable: true }
        event_type_id: { type: string, nullable: true }
        title: { type: string, example: 30 Min Consultation }
        description: { type: string, nullable: true }
        attendee_name: { type: string, nullable: true }
        attendee_email: { type: string, nullable: true }
        attendee_timezone: { type: string, nullable: true }
        start_time: { type: string, format: date-time, nullable: true }
        end_time: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [upcoming, completed, cancelled, rescheduled]
        meeting_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CalMeetingInput:
      type: object
      required: [cal_platform_id, title, attendee_name, attendee_email, start_time, end_time]
      properties:
        cal_platform_id: { type: integer }
        openorg_user_id: { type: integer, nullable: true, description: "Assign to an OpenOrg user from this platform" }
        title: { type: string }
        description: { type: string, nullable: true }
        attendee_name: { type: string }
        attendee_email: { type: string, format: email }
        attendee_timezone: { type: string, nullable: true }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status:
          type: string
          enum: [upcoming, completed, cancelled, rescheduled]
          default: upcoming
        meeting_url: { type: string, nullable: true }

    # ── Kanban Schemas ─────────────────────────────────────────────────────────

    KanbanBoard:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Sprint Board }
        description: { type: string, nullable: true }
        color: { type: string, example: "#6366f1" }
        is_active: { type: boolean }
        cal_platform_id: { type: integer, nullable: true, description: "Linked Cal.com platform — meetings auto-create cards" }
        cards_count: { type: integer }
        created_at: { type: string, format: date-time }

    KanbanBoardFull:
      allOf:
        - $ref: "#/components/schemas/KanbanBoard"
        - type: object
          properties:
            columns:
              type: array
              items: { $ref: "#/components/schemas/KanbanColumnFull" }

    KanbanBoardInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Sprint Board }
        description: { type: string, nullable: true }
        color: { type: string, example: "#6366f1" }
        is_active: { type: boolean, default: true }
        cal_platform_id: { type: integer, nullable: true, description: "Link to a Cal.com platform. New meetings for this platform auto-create kanban cards." }

    KanbanColumn:
      type: object
      properties:
        id: { type: integer }
        kanban_board_id: { type: integer }
        name: { type: string, example: In Progress }
        color: { type: string, example: "#0ea5e9" }
        wip_limit: { type: integer, nullable: true }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    KanbanColumnFull:
      allOf:
        - $ref: "#/components/schemas/KanbanColumn"
        - type: object
          properties:
            cards:
              type: array
              items: { $ref: "#/components/schemas/KanbanCard" }

    KanbanColumnInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: In Review }
        color: { type: string, example: "#f59e0b" }
        wip_limit: { type: integer, nullable: true, example: 5 }

    OpenorgUser:
      type: object
      properties:
        id: { type: integer }
        cal_platform_id: { type: integer }
        platform_name: { type: string, nullable: true }
        name: { type: string, example: John Doe }
        email: { type: string, format: email, example: john@example.com }
        phone: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    OpenorgUserInput:
      type: object
      required: [cal_platform_id, name, email]
      properties:
        cal_platform_id: { type: integer, description: "Platform this user belongs to" }
        name: { type: string, example: John Doe }
        email: { type: string, format: email, example: john@example.com }
        phone: { type: string, nullable: true }
        is_active: { type: boolean, default: true }

    KanbanCard:
      type: object
      properties:
        id: { type: integer }
        column_id: { type: integer }
        board_id: { type: integer }
        title: { type: string, example: Fix login bug }
        description: { type: string, nullable: true }
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date: { type: string, format: date, nullable: true }
        assignee: { type: string, nullable: true, description: "Free-text assignee (used when no platform user)" }
        openorg_user_id: { type: integer, nullable: true, description: "Linked OpenOrg platform user" }
        openorg_user:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
        source_meeting_id: { type: integer, nullable: true, description: "Set if card was auto-created from a Cal.com meeting" }
        is_meeting_card: { type: boolean, description: "If true, card is read-only — only drag & drop allowed" }
        labels:
          type: array
          items: { type: string }
          nullable: true
        position: { type: integer }
        created_at: { type: string, format: date-time }

    KanbanCardInput:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Fix login bug }
        description: { type: string, nullable: true }
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        due_date: { type: string, format: date, nullable: true, example: "2026-03-20" }
        assignee: { type: string, nullable: true, example: John Doe, description: "Free-text (used when board has no platform link)" }
        openorg_user_id: { type: integer, nullable: true, description: "Assign to a platform user (preferred over free-text assignee)" }
        labels:
          type: array
          items: { type: string }
          example: [backend, urgent-fix]

