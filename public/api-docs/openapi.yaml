        content:
          application/json:
            schema:
              type: object
              required: [carriers]
              properties:
                carriers:
                  type: array
                  items:
                    type: object
                    required: [carrier_code, country_code]
                    properties:
                      carrier_code: { type: string, example: "ups" }
                      country_code: { type: string, example: "US" }
                address_query: { type: string, example: "525 S Winchester Blvd, San Jose CA" }
                lat:           { type: number, example: 37.322 }
                long:          { type: number, example: -121.95 }
                radius:        { type: number, description: "Search radius in miles", example: 5 }
                max_results:   { type: integer, example: 10 }
      responses:
        '200': { description: List of service points }

  /shipengine/service-points/{carrierCode}/{countryCode}/{servicePointId}:
    get:
      summary: Get a service point
      tags: [ShipEngine — Service Points]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: carrierCode,    in: path, required: true, schema: { type: string }, example: "ups" }
        - { name: countryCode,    in: path, required: true, schema: { type: string }, example: "US" }
        - { name: servicePointId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Service point details }

  /shipengine/warehouses:
    get:
      summary: List warehouses
      tags: [ShipEngine — Warehouses]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of warehouses }
    post:
      summary: Create a warehouse
      tags: [ShipEngine — Warehouses]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, origin_address]
              properties:
                name:           { type: string, example: "Main Warehouse" }
                origin_address: { $ref: '#/components/schemas/SE_AddressInput' }
                return_address: { $ref: '#/components/schemas/SE_AddressInput' }
      responses:
        '200': { description: Created warehouse }

  /shipengine/warehouses/{warehouseId}:
    get:
      summary: Get a warehouse
      tags: [ShipEngine — Warehouses]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: warehouseId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Warehouse object }
    put:
      summary: Update a warehouse
      tags: [ShipEngine — Warehouses]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: warehouseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:           { type: string }
                origin_address: { $ref: '#/components/schemas/SE_AddressInput' }
                return_address: { $ref: '#/components/schemas/SE_AddressInput' }
      responses:
        '204': { description: Updated }
    delete:
      summary: Delete a warehouse
      tags: [ShipEngine — Warehouses]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: warehouseId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }

  /shipengine/batches:
    post:
      summary: Create a batch
      description: Group shipments or rate IDs for bulk label generation.
      tags: [ShipEngine — Batches]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label_layout:  { type: string, enum: [4x6, letter] }
                label_format:  { type: string, enum: [pdf, png, zpl] }
                shipment_ids:  { type: array, items: { type: string } }
                rate_ids:      { type: array, items: { type: string } }
      responses:
        '200': { description: Batch created }

  /shipengine/batches/{batchId}:
    get:
      summary: Get a batch
      tags: [ShipEngine — Batches]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Batch object with status and label count }

  /shipengine/batches/{batchId}/add:
    post:
      summary: Add shipments to batch
      tags: [ShipEngine — Batches]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipment_ids]
              properties:
                shipment_ids: { type: array, items: { type: string } }
      responses:
        '204': { description: Added }

  /shipengine/batches/{batchId}/remove:
    post:
      summary: Remove shipments from batch
      tags: [ShipEngine — Batches]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipment_ids]
              properties:
                shipment_ids: { type: array, items: { type: string } }
      responses:
        '204': { description: Removed }

  /shipengine/batches/{batchId}/process:
    post:
      summary: Process batch (generate all labels)
      tags: [ShipEngine — Batches]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label_layout:        { type: string, enum: [4x6, letter] }
                label_format:        { type: string, enum: [pdf, png, zpl] }
                label_download_type: { type: string, enum: [url, inline] }
      responses:
        '204': { description: Processing started }

  /shipengine/manifests:
    post:
      summary: Create a manifest (end-of-day close-out)
      description: |
        Generate an end-of-day manifest for a carrier.
        Required by some carriers (e.g. USPS SCAN form) to confirm all packages tendered that day.
      tags: [ShipEngine — Manifests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier_id]
              properties:
                carrier_id:   { type: string, example: "se-123456" }
                warehouse_id: { type: string }
                ship_date:    { type: string, format: date, example: "2026-03-09" }
                label_ids:    { type: array, items: { type: string } }
      responses:
        '200': { description: Manifest created }
    get:
      summary: List manifests
      tags: [ShipEngine — Manifests]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: carrier_id,      in: query, schema: { type: string } }
        - { name: warehouse_id,    in: query, schema: { type: string } }
        - { name: ship_date_start, in: query, schema: { type: string, format: date } }
        - { name: ship_date_end,   in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: List of manifests }

  /shipengine/manifests/{manifestId}:
    get:
      summary: Get a manifest
      tags: [ShipEngine — Manifests]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: manifestId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Manifest object }

  /shipengine/pickups:
    post:
      summary: Schedule a carrier pickup
      tags: [ShipEngine — Pickups]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier_id, warehouse_id, pickup_window]
              properties:
                carrier_id:   { type: string, example: "se-123456" }
                warehouse_id: { type: string }
                pickup_window:
                  type: object
                  required: [start_at, end_at]
                  properties:
                    start_at: { type: string, format: date-time }
                    end_at:   { type: string, format: date-time }
                label_ids:
                  type: array
                  items: { type: string }
                contact_details:
                  type: object
                  properties:
                    name:  { type: string }
                    phone: { type: string }
      responses:
        '200': { description: Pickup scheduled }
    get:
      summary: List pickups
      tags: [ShipEngine — Pickups]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: carrier_id,   in: query, schema: { type: string } }
        - { name: warehouse_id, in: query, schema: { type: string } }
        - { name: page,         in: query, schema: { type: integer } }
        - { name: page_size,    in: query, schema: { type: integer } }
      responses:
        '200': { description: List of pickups }

  /shipengine/pickups/{pickupId}:
    delete:
      summary: Cancel a pickup
      tags: [ShipEngine — Pickups]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: pickupId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Pickup cancelled }

# ── COMPONENTS ────────────────────────────────────────────────────────────────


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumToken
      description: |
        Laravel Sanctum token. Get it via `POST /api/auth/token`.
    siteApiKey:
      type: http
      scheme: bearer
      description: |
        Site API key (`SITE_API_KEY` from .env).
        Use this for public endpoints like `POST /api/register-business`.
    sanctumCookie:
      type: http
      scheme: bearer
      bearerFormat: SanctumToken
      description: |
        Laravel Sanctum token for admin SPA routes.
        Get it via `POST /api/auth/token` or session cookie after admin login.
    otpBearerAuth:
      type: http
      scheme: bearer
      description: |
        Encrypted OTP auth token returned by `POST /otp-auth/verify` or `POST /otp-auth/complete-profile`.
        This is NOT a Sanctum token — it is a Laravel `encrypt()` string.
        Store it client-side and send as `Authorization: Bearer <token>` to `GET /otp-auth/profile`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Record ID

  responses:
    MessageOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object

  schemas:

    # ── CUISINES ──────────────────────────────────────────────────────────────

    CuisinePublic:
      type: object
      description: Cuisine as returned to public (storefront / seller form)
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Afghan
        slug:
          type: string
          example: afghan
        icon:
          type: string
          nullable: true
          description: Tabler icon name (e.g. "flame") or absolute image URL
          example: "flame"
        hover_icon:
          type: string
          nullable: true
          description: Tabler icon name or image URL shown on hover
          example: null

    CuisineAdmin:
      allOf:
        - $ref: "#/components/schemas/CuisinePublic"
        - type: object
          properties:
            is_active:
              type: boolean
              example: true
            sort_order:
              type: integer
              example: 0
            muzzs_count:
              type: integer
              description: Number of Muzzhub restaurants attached to this cuisine (admin index only)
              example: 12

    CuisineWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: Italian
        icon:
          type: string
          nullable: true
          description: Tabler icon name or image URL
          example: "pizza"
        hover_icon:
          type: string
          nullable: true
          example: null
        is_active:
          type: boolean
          default: true
        sort_order:
          type: integer
          default: 0

    # ── MUZZHUB ───────────────────────────────────────────────────────────────

    MuzzhubCuisine:
      type: object
      description: Cuisine attached to a Muzzhub restaurant (pivot relation)
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        hover_icon:
          type: string
          nullable: true

    MuzzhubItem:
      type: object
      description: Muzzhub restaurant/seller record with eager-loaded relations
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: "Karahi House"
        slug:
          type: string
          example: "karahi-house"
        type:
          type: string
          nullable: true
          example: "restaurant"
        cuisine:
          type: string
          nullable: true
          description: Legacy plain-text cuisine field (being replaced by cuisines relation)
          example: "Afghan, Pakistani"
        cuisines:
          type: array
          description: Attached cuisine categories (pivot relation)
          items:
            $ref: "#/components/schemas/MuzzhubCuisine"
          example:
            - id: 1
              name: Afghan
              slug: afghan
              icon: "flame"
              hover_icon: null
            - id: 3
              name: Pakistani
              slug: pakistani
              icon: null
              hover_icon: null
        category:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            slug:
              type: string
            color:
              type: string
              nullable: true
            icon:
              type: string
              nullable: true
        business:
          type: object
          nullable: true
          description: Linked Business record (enables menu and order flow)
          properties:
            id:
              type: integer
            name:
              type: string
            slug:
              type: string
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          example: "us"
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        cover_image:
          type: string
          nullable: true
        is_active:
          type: boolean
        delivery:
          type: boolean
        featured:
          type: boolean
        rating:
          type: number
          format: float
          nullable: true
        review_count:
          type: integer
          nullable: true

    MuzzhubWrite:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        category_id:
          type: integer
          nullable: true
        business_id:
          type: integer
          nullable: true
          description: Link to Business for menu and order flow
        cuisine_ids:
          type: array
          items:
            type: integer
          description: Array of cuisine IDs to attach (replaces existing pivot entries on update)
          example: [1, 3, 7]
        slug:
          type: string
        type:
          type: string
          example: restaurant
        description:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
          example: us
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        logo:
          type: string
        cover_image:
          type: string
        is_active:
          type: boolean
          default: true
        delivery:
          type: boolean
          default: false
        featured:
          type: boolean
          default: false

    # ── CART ─────────────────────────────────────────────────────────────────

    CartModifierInput:
      type: object
      description: |
        Modifier selection sent by client. Only `option_id` and optional `quantity` — never prices.
      required:
        - option_id
      properties:
        option_id:
          type: integer
          description: ID from modifier_groups[].options[].id
          example: 12
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          default: 1
          description: How many of this modifier option (e.g. Extra Cheese × 2)
          example: 2

    CartModifierSnapshot:
      type: object
      description: |
        Resolved modifier stored in cart — all names and prices from DB, never from client.
        `line_total` = price_adjustment × quantity (convenience field).
      properties:
        group_id:
          type: integer
          example: 2
        group_name:
          type: string
          example: "Toppings"
        option_id:
          type: integer
          example: 12
        option_name:
          type: string
          example: "Extra Cheese"
        price_adjustment:
          type: number
          description: Per-unit price delta from DB (can be negative for discounts)
          example: 1.00
        quantity:
          type: integer
          description: How many of this modifier were selected
          example: 2
        line_total:
          type: number
          description: "price_adjustment × quantity (backend computed)"
          example: 2.00

    CartItem:
      type: object
      properties:
        id:
          type: integer
          example: 42
        session_id:
          type: string
          description: Internal session key (otp_users_5, uuid, or session id)
          example: "otp_users_5"
        business_id:
          type: integer
          example: 3
        menu_item_id:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        notes:
          type: string
          nullable: true
          example: "No onions"
        modifiers:
          type: array
          nullable: true
          description: |
            Resolved modifier snapshot. null if no modifiers selected.
            price_adjustment values are always from DB — never from client.
          items:
            $ref: "#/components/schemas/CartModifierSnapshot"
        menu_item:
          type: object
          description: Loaded menu item (name, base price, etc.)
          properties:
            id:
              type: integer
            name:
              type: string
              example: "Burger"
            price:
              type: number
              example: 10.00
            description:
              type: string
            image:
              type: string
              nullable: true
        seller:
          type: object
          nullable: true
          description: |
            Seller info — prefers Muzzhub record (richer data) when linked; falls back to Business.
            Check `source` field to know which table the data came from.
          properties:
            id:
              type: integer
            name:
              type: string
            logo:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            source:
              type: string
              enum: [muzzhub, business]
              description: "'muzzhub' = data from muzzhub table, 'business' = data from businesses table"
              example: muzzhub
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── OTP AUTH ERROR ───────────────────────────────────────────────────────

    OtpAuthError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Human-readable error reason
          example: "Token was issued for a different table. Re-verify with table=discovery_users."
        hint:
          type: string
          example: 'POST /otp-auth/verify with { email, otp, table: "discovery_users" } → use the returned "token" field.'
        code:
          type: string
          description: Machine-readable error code
          enum:
            - no_token
            - invalid_token
            - invalid_token_type
            - wrong_table
            - token_expired
            - user_not_found
            - decrypt_failed
          example: wrong_table

    # ── OTP AUTH ────────────────────────────────────────────────────────────

    OtpVerifyRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        otp:
          type: string
          minLength: 4
          maxLength: 10
          example: "123456"
        table:
          type: string
          description: DB table to check email in
          default: users
          example: discovery_users
        check_email:
          type: boolean
          default: true
          description: Whether to check if email exists in the table
        on_found:
          type: string
          enum:
            - token
            - message
          default: token
          description: What to return when email is found
        on_not_found:
          type: string
          enum:
            - token
            - message
            - profile
            - create
          default: profile
          description: |
            What to return when email is NOT found:
            - `token` — issue token anyway (OTP-only auth)
            - `message` — return message only
            - `profile` — return otp_token for complete-profile flow
            - `create` — auto-create user record and return token
        found_message:
          type: string
          description: Custom success message when email is found
        not_found_message:
          type: string
          description: Custom message when email is not found
        create_data:
          type: object
          description: Extra fields to insert when on_not_found=create
        skip_token:
          type: boolean
          default: false
          description: Return user data without a token (on_found=token ignored)
        device_info:
          type: object
          description: Device/location fingerprint — captured into discovery_users table
          properties:
            fingerprint:
              type: string
            browser:
              type: string
            os:
              type: string
            device_type:
              type: string
              example: mobile
            timezone:
              type: string
              example: America/New_York
            lat:
              type: number
              format: float
            lng:
              type: number
              format: float
            city:
              type: string
            country:
              type: string
            country_code:
              type: string
              example: US

    OtpVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - authenticated
            - profile_incomplete
            - not_found
            - created
            - otp_verified
        message:
          type: string
          example: Welcome back!
        token:
          type: string
          description: Encrypted auth token (present for authenticated/created/otp_verified)
        otp_token:
          type: string
          description: Short-lived session token (present when status=profile_incomplete)
        email:
          type: string
          format: email
        user:
          type: object
          description: User row from DB table (password removed)

    OtpSettings:
      type: object
      properties:
        allowed_tables:
          type: array
          items:
            type: string
          example:
            - users
            - discovery_users
        table_options:
          type: object
          description: Per-table verify behavior overrides
        resend_configured:
          type: boolean
        from_email:
          type: string
          format: email
        from_name:
          type: string
        otp_length:
          type: integer
          example: 6
        otp_expires_minutes:
          type: integer
          example: 10
        max_attempts:
          type: integer
          example: 5
        resend_cooldown:
          type: integer
          example: 60
          description: Seconds to wait before resending OTP
        token_expires_days:
          type: integer
          example: 30

    OtpTableOptions:
      type: object
      description: Per-table default behavior for OTP verify
      properties:
        check_email:
          type: boolean
          default: true
        on_found:
          type: string
          enum:
            - token
            - message
        on_not_found:
          type: string
          enum:
            - token
            - message
            - profile
            - create
        skip_token:
          type: boolean
        found_message:
          type: string
        not_found_message:
          type: string

    # ── GENERAL ─────────────────────────────────────────────────────────────

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    BusinessRegistrationSubmit:
      type: object
      required:
        - business_name
        - contact_name
        - contact_email
        - agreement_accepted
        - signature_name
      properties:
        business_name:
          type: string
          example: My Halal Restaurant
        address:
          type: string
        address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
          default: US
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        website_url:
          type: string
          format: uri
        menu_url:
          type: string
          format: uri
        external_site_url:
          type: string
          format: uri
          description: URL on external site where this business should appear after approval
