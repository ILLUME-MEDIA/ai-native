                    type: number
                    example: 31.48
                  customer_name:
                    type: string
                  customer_email:
                    type: string
                  customer_phone:
                    type: string
                  delivery_address:
                    type: string
                    nullable: true
                  delivery_vendor:
                    type: string
                    nullable: true
                  doordash_delivery_id:
                    type: string
                    nullable: true
                    description: Set if DoorDash auto-dispatch succeeded
                  doordash_status:
                    type: string
                    nullable: true
                  doordash_tracking_url:
                    type: string
                    nullable: true
                  tracking_url:
                    type: string
                    nullable: true
