  # ── Uber Direct (Delivery as a Service) ──────────────────────────────────────

  /delivery/uber-direct/config:
    get:
      tags: [Uber Direct]
      summary: Get Uber Direct setup config and webhook URL
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Config and setup instructions
          content:
            application/json:
              schema:
                type: object
                properties:
                  env:            {type: string, example: "sandbox"}
                  customer_id:    {type: string, example: "cus_xxxxxxxxxxxxxxxx"}
                  webhook_url:    {type: string, example: "https://yourdomain.com/api/webhooks/delivery/uber-direct"}
                  sandbox_note:   {type: string, example: "Sandbox only supports San Francisco addresses."}
                  credentials_required:
                    type: array
                    items: {type: string}
                    example: [UBER_DIRECT_CLIENT_ID, UBER_DIRECT_CLIENT_SECRET, UBER_DIRECT_CUSTOMER_ID, UBER_DIRECT_ENV]

  /delivery/uber-direct/quote:
    post:
      tags: [Uber Direct]
      summary: Get a delivery quote from Uber Direct
      description: |
        Get a real delivery fee estimate from Uber Direct (DaaS).

        Pass `business_id` to automatically use the business address for pickup.
        Only provide `pickup_address` to override the business address.

        > **Sandbox note:** Only San Francisco area addresses are deliverable in sandbox mode.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dropoff_address]
              properties:
                business_id:
                  type: integer
                  description: Auto-fills pickup address from business (Muzzhub) record
                  example: 1
                pickup_address:
                  type: string
                  description: JSON-encoded Uber Direct address. Overrides business_id pickup.
                  example: '{"street_address":["100 Market St"],"city":"San Francisco","state":"CA","zip_code":"94105","country":"US"}'
                dropoff_address:
                  type: string
                  description: JSON-encoded Uber Direct address (customer address)
                  example: '{"street_address":["201 3rd St"],"city":"San Francisco","state":"CA","zip_code":"94103","country":"US"}'
                order_value:
                  type: number
                  description: Order value in dollars
                  example: 35.50
                pickup_phone_number:
                  type: string
                  description: Pickup phone (auto-filled from business if business_id provided)
                  example: "+14155551234"
                dropoff_phone_number:
                  type: string
                  description: Customer phone number
                  example: "+14155559876"
                external_store_id:
                  type: string
                  description: Your Uber Direct store ID (optional)
      responses:
        '200':
          description: Quote result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:            {type: boolean, example: true}
                  vendor:             {type: string, example: uber_direct}
                  fee:                {type: number, example: 5.99}
                  fee_cents:          {type: integer, example: 599}
                  currency:           {type: string, example: USD}
                  estimated_minutes:  {type: integer, example: 35}
                  expires_at:         {type: string, nullable: true}
                  quote_id:           {type: string, nullable: true, example: "dq_abc123"}
                  raw:                {type: object}
        '422':
          description: Missing address or not in deliverable area
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: false}
                  vendor:  {type: string, example: uber_direct}
                  message: {type: string, example: "Uber Direct error: The specified location is not in a deliverable area."}

  /delivery/uber-direct/deliveries:
    get:
      tags: [Uber Direct]
      summary: List all Uber Direct deliveries
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: List of deliveries from Uber Direct

  /delivery/uber-direct/stores:
    get:
      tags: [Uber Direct]
      summary: Find Uber Direct stores near a location
      security: [{bearerAuth: []}]
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}, example: 37.7749}
        - {name: lng, in: query, required: true, schema: {type: number}, example: -122.4194}
        - {name: external_store_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: List of stores

  /delivery/uber-direct/dispatch/{order}:
    post:
      tags: [Uber Direct]
      summary: Dispatch Uber Direct delivery for an order
      description: |
        Creates a delivery with Uber Direct for an existing order.
        Pickup is auto-filled from the order's business address.
        Dropoff is the customer's delivery address from the order.
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}, description: Order ID}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tip_cents:   {type: integer, description: Tip in cents, example: 300}
                requires_id: {type: boolean, description: Require ID verification at dropoff}
      responses:
        '200':
          description: Delivery dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:      {type: boolean, example: true}
                  delivery_id:  {type: string, example: "del_abc123xyz"}
                  status:       {type: string, example: "pending"}
                  tracking_url: {type: string, nullable: true}
                  fee:          {type: number, example: 5.99}
        '404': {description: Order not found}
        '422': {description: Order has no delivery address}
        '502': {description: Uber Direct API error}

  /delivery/uber-direct/status/{order}:
    get:
      tags: [Uber Direct]
      summary: Get live delivery status from Uber Direct
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Current delivery status
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_id:  {type: string}
                  status:       {type: string, example: "dropoff"}
                  status_label: {type: string, example: "Out for Delivery"}
                  tracking_url: {type: string, nullable: true}
                  courier:      {type: object, nullable: true}
                  raw:          {type: object}
        '404': {description: No Uber Direct delivery for this order}

  /delivery/uber-direct/update/{order}:
    patch:
      tags: [Uber Direct]
      summary: Update an active Uber Direct delivery
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dropoff_notes: {type: string}
                tip:           {type: integer, description: Tip in cents}
      responses:
        '200': {description: Delivery updated}
        '404': {description: No Uber Direct delivery for this order}

  /delivery/uber-direct/cancel/{order}:
    post:
      tags: [Uber Direct]
      summary: Cancel an active Uber Direct delivery
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Delivery cancelled}
        '404': {description: No Uber Direct delivery for this order}

  /delivery/uber-direct/proof/{order}:
    get:
      tags: [Uber Direct]
      summary: Get proof of delivery (signature / photo)
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Proof of delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature_image_url: {type: string, nullable: true}
                  photo_urls: {type: array, items: {type: string}}
        '404': {description: No Uber Direct delivery for this order}

  # ── Uber Direct: Courier Pick & Pack (CPP) ────────────────────────────────────

  /delivery/uber-direct/cpp/quote:
    post:
      tags: [Uber Direct - CPP]
      summary: Get a CPP (Courier Pick & Pack) quote
      description: |
        Courier Pick & Pack (CPP) — courier picks up individual items from your store and packs them.

        CPP requires a special business agreement with Uber Direct.

        `manifest_items` is required and must be an array of **item objects** (not strings).

        > **Sandbox note:** Only San Francisco area addresses are deliverable.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dropoff_address, manifest_items]
              properties:
                business_id:
                  type: integer
                  description: Auto-fills pickup address and phone from business record
                  example: 1
                pickup_address:
                  type: string
                  description: JSON-encoded pickup address. Overrides business_id.
                  example: '{"street_address":["100 Market St"],"city":"San Francisco","state":"CA","zip_code":"94105","country":"US"}'
                dropoff_address:
                  type: string
                  example: '{"street_address":["201 3rd St"],"city":"San Francisco","state":"CA","zip_code":"94103","country":"US"}'
                dropoff_phone_number:
                  type: string
                  example: "+14155559876"
                pickup_phone_number:
                  type: string
                  example: "+14155551234"
                manifest_total_value:
                  type: integer
                  description: Total order value in cents
                  example: 3550
                external_store_id:
                  type: string
                  description: Your registered Uber Direct store ID
                manifest_items:
                  type: array
                  description: Items for the courier to pick and pack. Each item must be an object.
                  items:
                    type: object
                    required: [name, quantity, price]
                    properties:
                      name:             {type: string, example: "Cheeseburger"}
                      quantity:         {type: integer, example: 2}
                      price:            {type: integer, description: "Price in cents (e.g. 1200 = $12.00)", example: 1200}
                      size:             {type: string, enum: [small, medium, large], example: "small"}
                      must_be_upright:  {type: boolean, example: false}
                      replacement_type:
                        type: string
                        enum: [no_replacement, best_available, ask_customer]
                        example: "no_replacement"
                  example:
                    - name: "Cheeseburger"
                      quantity: 2
                      price: 1200
                      size: "small"
                    - name: "Fries"
                      quantity: 1
                      price: 450
                      size: "small"
      responses:
        '200':
          description: CPP quote result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:           {type: boolean, example: true}
                  vendor:            {type: string, example: uber_direct}
                  fee:               {type: number, example: 7.99}
                  fee_cents:         {type: integer, example: 799}
                  currency:          {type: string, example: USD}
                  estimated_minutes: {type: integer, example: 40}
                  quote_id:          {type: string, example: "dq_cpp123"}
                  expires_at:        {type: string, nullable: true}
                  raw:               {type: object}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: "The manifest_items.0.name field is required. (and 2 more errors)"}
                  errors:
                    type: object
                    example:
                      "manifest_items.0.name": ["The manifest_items.0.name field is required."]
                      "manifest_items.0.quantity": ["The manifest_items.0.quantity field is required."]
                      "manifest_items.0.price": ["The manifest_items.0.price field is required."]

  /delivery/uber-direct/cpp/dispatch/{order}:
    post:
      tags: [Uber Direct - CPP]
      summary: Dispatch a CPP delivery for an order
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tip_cents:   {type: integer, example: 300}
                requires_id: {type: boolean}
                manifest_items:
                  type: array
                  items:
                    type: object
                    required: [name, quantity, price]
                    properties:
                      name:             {type: string, example: "Burger"}
                      quantity:         {type: integer, example: 1}
                      price:            {type: integer, example: 1200}
                      size:             {type: string, example: "small"}
                      replacement_type: {type: string, example: "no_replacement"}
      responses:
        '200': {description: CPP delivery dispatched}
        '404': {description: Order not found}
        '502': {description: Uber Direct API error}

  # ── Uber Direct Webhook ───────────────────────────────────────────────────────

  /webhooks/delivery/uber-direct:
    post:
      tags: [Uber Direct]
      summary: Uber Direct webhook receiver
      description: |
        Register this URL in the Uber Direct developer portal to receive delivery status updates.

        **Webhook URL:** `POST /api/webhooks/delivery/uber-direct`

        **Events handled:**
        - `delivery.status.pending` → order status: `preparing`
        - `delivery.status.pickup` → order status: `out_for_delivery`
        - `delivery.status.pickup_complete` → order status: `out_for_delivery`
        - `delivery.status.dropoff` → order status: `out_for_delivery`
        - `delivery.status.delivered` → order status: `delivered`
        - `delivery.status.cancelled` → order status: `cancelled`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:  {type: string, example: "delivery.status.delivered"}
                delivery_id: {type: string, example: "del_abc123xyz"}
                status:      {type: string, example: "delivered"}
                location:
                  type: object
                  properties:
                    lat: {type: number, example: 37.7749}
                    lng: {type: number, example: -122.4194}
      responses:
        '200': {description: Acknowledged}

  # ── DOORDASH SHOP & DELIVER ───────────────────────────────────────────────────

  /delivery/doordash-shop/env:
    get:
      tags: [DoorDash Shop & Deliver]
      summary: Check DoorDash Shop credentials status
      description: Returns whether DOORDASH_SHOP credentials are configured and the current environment (sandbox/production).
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Credentials status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean}
                  environment: {type: string, example: "sandbox"}
                  developer_id: {type: string, example: "abc123..."}

  /delivery/doordash-shop/quote:
    post:
      tags: [DoorDash Shop & Deliver]
      summary: Get a delivery quote from DoorDash Shop & Deliver
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:       {type: integer, example: 42}
                contains_alcohol: {type: boolean, example: false}
      responses:
        '200':
          description: Quote returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:          {type: boolean}
                  external_delivery_id: {type: string}
                  fee:              {type: integer, description: "Fee in cents"}
                  currency:         {type: string, example: "USD"}
                  estimated_pickup_time:  {type: string, format: date-time}
                  estimated_dropoff_time: {type: string, format: date-time}
        '422': {description: Validation error or DoorDash API error}

  /delivery/doordash-shop/dispatch/{order}:
    post:
      tags: [DoorDash Shop & Deliver]
      summary: Dispatch a DoorDash Shop & Deliver for an order
      description: |
        A Dasher will be assigned to shop the order items from the merchant store and deliver them to the customer.

        `items` is built automatically from the order's line items. Override via `items` body param if needed.

        On success, updates `doordash_shop_delivery_id`, `doordash_shop_status`, and `doordash_shop_tracking_url` on the order.
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}, description: Order ID}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contains_alcohol: {type: boolean, example: false}
                items:
                  type: array
                  description: Override shopping list (defaults to order line items)
                  items:
                    type: object
                    properties:
                      name:          {type: string, example: "Burger"}
                      description:   {type: string, example: "Classic beef burger"}
                      quantity:      {type: integer, example: 1}
                      external_id:   {type: string, example: "item-42"}
                      price:         {type: integer, example: 1200, description: "Price in cents"}
      responses:
        '200':
          description: Shop & Deliver dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:              {type: boolean}
                  delivery_id:          {type: string}
                  status:               {type: string, example: "created"}
                  tracking_url:         {type: string}
                  estimated_pickup_time:  {type: string, format: date-time}
                  estimated_dropoff_time: {type: string, format: date-time}
        '422': {description: Already dispatched or DoorDash API error}

  /delivery/doordash-shop/status/{order}:
    get:
      tags: [DoorDash Shop & Deliver]
      summary: Get live status of a DoorDash Shop & Deliver delivery
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}, description: Order ID}
      responses:
        '200':
          description: Delivery status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:      {type: boolean}
                  delivery_id:  {type: string}
                  status:       {type: string, example: "dasher_confirmed"}
                  status_label: {type: string, example: "Dasher Confirmed"}
                  tracking_url: {type: string}
        '404': {description: No Shop delivery for this order}

  /delivery/doordash-shop/cancel/{order}:
    post:
      tags: [DoorDash Shop & Deliver]
      summary: Cancel a DoorDash Shop & Deliver delivery
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}, description: Order ID}
      responses:
        '200':
          description: Delivery cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  message: {type: string}
        '404': {description: No active Shop delivery to cancel}

  /webhooks/delivery/doordash-shop:
    post:
      tags: [DoorDash Shop & Deliver]
      summary: DoorDash Shop webhook receiver
      description: |
        Configure this URL in the DoorDash Developer Portal for Shop & Deliver webhooks.

        **Webhook URL:** `POST /api/webhooks/delivery/doordash-shop`

        No authentication required (DoorDash sends HMAC signature in headers).

        **Status updates** are saved to `doordash_shop_status` on the order.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                external_delivery_id: {type: string}
                delivery_status:      {type: string, example: "dasher_confirmed"}
      responses:
        '200': {description: Acknowledged}

  # ── SHIPENGINE DELIVERY ────────────────────────────────────────────────────────

  /delivery/shipengine/carriers:
    get:
      tags: [ShipEngine Delivery]
      summary: List connected ShipEngine carriers
      description: Returns all carriers connected to your ShipEngine account (USPS, UPS, FedEx, DHL, etc.).
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Carrier list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:  {type: boolean}
                  carriers:
                    type: array
                    items:
                      type: object
                      properties:
                        carrier_id:   {type: string, example: "se-123456"}
                        carrier_code: {type: string, example: "stamps_com"}
                        nickname:     {type: string, example: "USPS"}
                        friendly_name: {type: string, example: "Stamps.com"}
                        balance:      {type: number}
        '422': {description: ShipEngine API error}

  /delivery/shipengine/rates/{order}:
    post:
      tags: [ShipEngine Delivery]
      summary: Get shipping rate options for an order
      description: |
        Returns available carrier + service combinations with pricing, sorted by price ascending.

        Use the `carrier_id` and `service_code` from the response to call `dispatch`.
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}, description: Order ID}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weight_oz:   {type: number, example: 16, description: "Package weight in ounces (default: 16)"}
                length_in:   {type: number, example: 10, description: "Package length in inches (default: 10)"}
                width_in:    {type: number, example: 8,  description: "Package width in inches (default: 8)"}
                height_in:   {type: number, example: 4,  description: "Package height in inches (default: 4)"}
                carrier_ids:
                  type: array
                  description: Filter to specific carrier IDs (empty = all carriers)
                  items: {type: string, example: "se-123456"}
      responses:
        '200':
          description: Rate options sorted by price
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  rates:
                    type: array
                    items:
                      type: object
                      properties:
                        rate_id:       {type: string}
                        carrier_id:    {type: string, example: "se-123456"}
                        carrier_code:  {type: string, example: "stamps_com"}
                        service_code:  {type: string, example: "usps_priority_mail"}
                        service_type:  {type: string, example: "Priority Mail"}
                        shipping_amount:
                          type: object
                          properties:
                            amount:   {type: number, example: 8.25}
                            currency: {type: string, example: "usd"}
                        delivery_days: {type: integer, example: 2}
        '422': {description: ShipEngine API error}

  /delivery/shipengine/dispatch/{order}:
    post:
      tags: [ShipEngine Delivery]
      summary: Create a shipping label for an order
      description: |
        Creates a shipping label via ShipEngine and saves tracking info to the order.

        On success, updates `shipengine_label_id`, `shipengine_tracking_number`, `shipengine_carrier_code`,
        `shipengine_label_url`, `delivery_vendor`, and `tracking_url` on the order.

        Print the `label_url` (PDF) and attach to the package.
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}, description: Order ID}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier_id, service_code]
              properties:
                carrier_id:   {type: string, example: "se-123456", description: "From GET /delivery/shipengine/carriers"}
                service_code: {type: string, example: "usps_priority_mail", description: "From POST /delivery/shipengine/rates/{order}"}
                weight_oz:    {type: number, example: 16, description: "Package weight in ounces (default: 16)"}
                length_in:    {type: number, example: 10, description: "Package length in inches (default: 10)"}
                width_in:     {type: number, example: 8,  description: "Package width in inches (default: 8)"}
                height_in:    {type: number, example: 4,  description: "Package height in inches (default: 4)"}
      responses:
        '200':
          description: Shipping label created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:          {type: boolean}
                  message:          {type: string, example: "Shipping label created."}
                  label_id:         {type: string, example: "se-label-1234"}
                  tracking_number:  {type: string, example: "9400111899223397867944"}
                  carrier_code:     {type: string, example: "stamps_com"}
                  label_url:        {type: string, description: "PDF label URL to print and attach to package"}
                  tracking_url:     {type: string, description: "Carrier tracking page URL"}
        '422': {description: Label already exists for this order, or ShipEngine API error}

  /delivery/shipengine/status/{order}:
    get:
      tags: [ShipEngine Delivery]
      summary: Get shipment tracking status for an order
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}, description: Order ID}
      responses:
        '200':
          description: Tracking info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:          {type: boolean}
                  status:           {type: string, example: "in_transit"}
                  status_label:     {type: string, example: "In Transit"}
                  carrier_code:     {type: string, example: "stamps_com"}
                  tracking_number:  {type: string}
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        occurred_at:  {type: string, format: date-time}
                        description:  {type: string}
                        city_locality: {type: string}
                        state_province: {type: string}
        '404': {description: No tracking info for this order}
        '422': {description: ShipEngine API error}

  /delivery/shipengine/void/{order}:
    post:
      tags: [ShipEngine Delivery]
      summary: Void (cancel) a shipping label
      description: |
        Voids the shipping label for an order. If approved, removes `shipengine_label_id` and `shipengine_tracking_number` from the order so a new label can be created.

        Labels can typically only be voided before they are scanned by the carrier.
      security: [{bearerAuth: []}]
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}, description: Order ID}
      responses:
        '200':
          description: Void result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:  {type: boolean}
                  approved: {type: boolean}
                  message:  {type: string, example: "Label void request submitted."}
        '404': {description: No label to void for this order}
        '422': {description: ShipEngine API error}

  # ── PLATFORM ORDERS (UNIFIED) ─────────────────────────────────────────────────

  /delivery/platform-orders:
    get:
      tags:
        - Platform Orders
      summary: List all platform orders (all vendors unified)
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
        - name: platform
          in: query
          schema:
            type: string
            enum: [ubereats, instacart, grubhub, skip, doordash]
        - name: status
          in: query
          schema:
            type: string
            enum: [received, accepted, rejected, preparing, ready, picked_up, delivered, cancelled, failed]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          example: "2026-02-01"
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          example: "2026-02-28"
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Paginated platform orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPlatformOrders"

  /delivery/platform-orders/summary:
    get:
      tags:
        - Platform Orders
      summary: Dashboard summary — counts and revenue by platform
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Summary data
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_orders:
                    type: integer
                    example: 3
                  today:
                    type: object
                    properties:
                      orders_today:
                        type: integer
                        example: 12
                      revenue_today:
                        type: number
                        example: 450.00
                      fees_today:
                        type: number
                        example: 45.00
                  by_platform:
                    type: array
                    items:
                      type: object
                      properties:
                        platform:
                          type: string
                        total:
                          type: integer
                        total_payout:
                          type: number
                  by_status:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        total:
                          type: integer

  /delivery/platform-orders/{platformOrder}:
    get:
      tags:
        - Platform Orders
      summary: Platform order detail (with items + linked internal order)
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Platform order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrder"

  /delivery/platform-orders/{platformOrder}/status:
    patch:
      tags:
        - Platform Orders
      summary: Update platform order status (admin)
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [received, accepted, rejected, preparing, ready, picked_up, delivered, cancelled, failed]
                reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Status updated


  # ─────────────────────────────────────────────────────────────────────────────
  # Platform User Auth
  # ─────────────────────────────────────────────────────────────────────────────

  /api/cal/{table}/users:
    get:
      tags: [Platform User Auth]
      summary: Get user profile by email
      description: Look up a user in the platform's user table by email. Requires SITE_API_KEY.
      security: [{ siteApiKey: [] }]
      parameters:
        - { name: table, in: path,  required: true, schema: { type: string }, example: openorg_users, description: "DB table name — platform auto-resolved from this" }
        - { name: email, in: query, required: true, schema: { type: string, format: email }, example: ali@openorg.com }
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:  { $ref: "#/components/schemas/CalPlatformUser" }
                  table: { type: string, example: openorg_users }
        "404": { description: User or platform not found }
        "403": { description: Table not registered }
        "401": { description: Missing or invalid SITE_API_KEY }
        "422": { description: email missing }

    post:
      tags: [Platform User Auth]
      summary: Find or create user — returns auth token
      description: |
        Find existing user by email, or create new one. Always returns an encrypted auth token.
        `status: "found"` = existing user returned, `status: "created"` = new user inserted (HTTP 201).
        Token is encrypted Laravel payload — same format as OTP auth. Use as Bearer on /meetings and /cards.
      security: [{ siteApiKey: [] }]
      parameters:
        - { name: table, in: path, required: true, schema: { type: string }, example: openorg_users }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:  { type: string, example: Ali Khan }
                email:       { type: string, format: email, example: ali@openorg.com }
                phone:       { type: string, nullable: true, example: "+923001234567" }
                metadata:    { type: object, nullable: true }
      responses:
        "201":
          description: New user created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalPlatformUserAuthResponse" }
              example:
                success: true
                status: created
                token: "eyJpdiI6Ik..."
                table: openorg_users
                user:
                  id: 42
                  name: Ali Khan
                  email: ali@openorg.com
                  phone: "+923001234567"
                  is_active: true
                  cal_platform_id: 1
                  metadata: {}
                  created_at: "2026-03-09T10:00:00.000000Z"
                  updated_at: "2026-03-09T10:00:00.000000Z"
        "200":
          description: Existing user found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalPlatformUserAuthResponse" }
              example:
                success: true
                status: found
                token: "eyJpdiI6Ik..."
                table: openorg_users
                user:
                  id: 42
                  name: Ali Khan
                  email: ali@openorg.com
                  phone: "+923001234567"
                  is_active: true
                  cal_platform_id: 1
                  metadata: {}
                  created_at: "2026-03-05T08:00:00.000000Z"
                  updated_at: "2026-03-09T10:00:00.000000Z"
        "422": { description: Validation error }
        "403": { description: Table not allowed }
        "404": { description: Platform not found or inactive }

  /api/cal/{table}/meetings:
    get:
      tags: [Platform User Auth]
      summary: List platform meetings with linked Kanban card
      description: |
        **Public endpoint — no authentication required.**
        No email/token: returns all meetings for the platform.
        With `?email=` param OR Bearer token: returns only that user's meetings.
        Each meeting includes a `kanban_card` field with the linked Kanban card (column, position).
      security:
        - otpBearerAuth: []
        - {}
      parameters:
        - { name: table,    in: path,  required: true,  schema: { type: string }, example: openorg_users }
        - { name: email,    in: query, required: false, schema: { type: string, format: email }, example: ali@openorg.com, description: "Optional — filter by email. Or pass Bearer token instead." }
        - { name: status,   in: query, required: false, schema: { type: string, enum: [upcoming, completed, cancelled, rescheduled] } }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 15, maximum: 100 } }
      responses:
        "200":
          description: Paginated meetings each with linked kanban_card
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CalMeetingPublic"
                        - type: object
                          properties:
                            kanban_card:
                              nullable: true
                              type: object
                              properties:
                                id:           { type: integer }
                                column_id:    { type: integer }
                                column_name:  { type: string }
                                column_color: { type: string }
                                position:     { type: integer }
                  total:        { type: integer }
                  current_page: { type: integer }
                  last_page:    { type: integer }
                  user_email:   { type: string, nullable: true }
              example:
                data:
                  - id: 3
                    cal_platform_id: 4
                    openorg_user_id: null
                    user_source: null
                    booking_uid: "5eZZsNt3ze1mGK5Eun2bZ3"
                    event_type_id: ""
                    title: "15 Min Meeting between Fahad K. and Muhammad Fahad khan"
                    description: ""
                    attendee_name: "Muhammad Fahad khan"
                    attendee_email: "kmuhammadfahad496@gmail.com"
                    attendee_timezone: "Asia/Karachi"
                    start_time: "2026-03-12T04:30:00.000000Z"
                    end_time: "2026-03-12T04:45:00.000000Z"
                    status: "accepted"
                    meeting_url: "https://meet.google.com/qay-wpiw-yzd"
                    metadata: {}
                    created_at: "2026-03-09T06:26:46.000000Z"
                    updated_at: "2026-03-09T06:26:46.000000Z"
                    kanban_card:
                      id: 2
                      column_id: 10
                      column_name: "To Do"
                      column_color: "#e5e7eb"
                      position: 0
                total: 1
                current_page: 1
                last_page: 1
                user_email: null

  /api/cal/{table}/cards:
    get:
      tags: [Platform User Auth]
      summary: Get Kanban cards by email (query param or Bearer token)
      description: |
        Returns all Kanban cards linked to the given email across all boards of the platform.
        Email can be provided two ways:
        - `?email=` query param (direct, no auth needed)
        - Bearer token (from POST /users) — email extracted automatically
        Matches by `metadata.attendee_email` or `assignee`.
      security:
        - otpBearerAuth: []
        - {}
      parameters:
        - { name: table, in: path,  required: true,  schema: { type: string }, example: openorg_users }
        - { name: email, in: query, required: false, schema: { type: string, format: email }, example: ali@openorg.com, description: "Pass email here OR use Bearer token — one of the two is required" }
      responses:
        "200":
          description: Cards for the given email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CalPlatformCard" }
                  total:      { type: integer }
                  user_email: { type: string, example: ali@openorg.com }
        "422": { description: email param or Bearer token required }
        "404": { description: Platform not found }

  # ── SHIPENGINE ──────────────────────────────────────────────────────────────

  /shipengine/account/settings:
