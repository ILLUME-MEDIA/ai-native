    post:
      tags:
        - Orders
      security: []
      summary: Place an order
      description: |
        Converts cart items for the given `business_id` into an order.

        **Use the same session identifier you used for cart:**

        - OTP Bearer token: `Authorization: Bearer <token-from-otp-verify>`
        - Guest: `X-Session-Id: <your-uuid>`

        Server finds cart items by session → creates order → clears cart for that business.
        Use Muzzhub seller's linked `business_id` when ordering from a Muzzhub seller.
      parameters:
        - name: Authorization
          in: header
