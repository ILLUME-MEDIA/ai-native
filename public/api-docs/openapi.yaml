                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                icon:
                  type: string
                color:
                  type: string
                is_active:
                  type: boolean
      responses:
        "201":
          description: Created

  /ecommerce/muzzhub-categories/{id}:
    patch:
      tags:
        - Muzzhub
      summary: Update Muzzhub category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
