  # ── MUZZHUB (Sellers / Listings) ──────────────────────────────────────────

  /ecommerce/muzzhub:
    get:
      tags:
        - Muzzhub
      security: []
      summary: List Muzzhub sellers (restaurants)
      description: |
        **Query filters** — all optional; combine to fetch exactly what you need.

        **Location-based search**: pass `lat` + `lng` to filter by proximity. Results will be sorted nearest-first and include a `distance_miles` field. Use `radius` to control the search range (default 100 miles).
      parameters:
        - name: lat
          in: query
          schema:
            type: number
            format: float
            example: 40.7128
          description: "Latitude of the user's location (decimal degrees). Requires `lng`."
        - name: lng
          in: query
          schema:
            type: number
            format: float
            example: -74.006
          description: "Longitude of the user's location (decimal degrees). Requires `lat`."
        - name: radius
          in: query
          schema:
            type: number
            format: float
            default: 100
            example: 25
          description: "Search radius in miles (default 100). Only applied when `lat`+`lng` are provided."
        - name: search
          in: query
          schema:
            type: string
          description: Search in seller name (partial match)
        - name: category_id
          in: query
          schema:
            type: integer
          description: Muzzhub category ID (e.g. from GET /ecommerce/muzzhub-categories)
        - name: active_only
          in: query
          schema:
            type: boolean
          description: If true, only is_active = true
        - name: type
          in: query
          schema:
            type: string
          description: Filter by type (e.g. restaurant, cafe)
        - name: city
          in: query
          schema:
            type: string
          description: City (partial match)
        - name: country
          in: query
          schema:
            type: string
          description: Country code (e.g. us)
        - name: delivery
          in: query
          schema:
            type: boolean
          description: If true, only sellers with delivery = true
        - name: featured
          in: query
          schema:
            type: boolean
          description: If true, only featured sellers
        - name: cuisine_id
          in: query
          schema:
            type: string
          description: "Filter by cuisine ID — preferred over legacy `cuisine`. Single ID or comma-separated (cuisine_id=3,7) or repeated (cuisine_id[]=3&cuisine_id[]=7). OR logic: restaurant matches if it has ANY of the given cuisine IDs."
          example: "3,7"
        - name: cuisine
          in: query
          schema:
            type: string
          description: "Legacy text filter — filter by cuisine name (partial, OR logic). Use `cuisine_id` for exact matching. Pass comma-separated or repeated."
          example: "Afghan,Italian"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        "200":
          description: Paginated Muzzhub listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MuzzhubItem"
                  current_page:
                    type: integer
                  last_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
    post:
      tags:
        - Muzzhub
      summary: Create Muzzhub listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuzzhubWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuzzhubItem"

  /ecommerce/muzzhub/{id}:
    get:
      tags:
        - Muzzhub
      security: []
      summary: Get Muzzhub seller detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Muzzhub record with category and business
    patch:
      tags:
        - Muzzhub
      summary: Update Muzzhub listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuzzhubWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuzzhubItem"
    delete:
      tags:
        - Muzzhub
      summary: Delete (soft) Muzzhub listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/MessageOk"

  /ecommerce/muzzhub-categories:
    get:
      tags:
        - Muzzhub
      security: []
      summary: List Muzzhub categories
      description: |
        **Query filters** — for dropdowns use `all=1` to get full list without pagination.
      parameters:
        - name: active_only
          in: query
          schema:
            type: boolean
          description: If true, only is_active categories
        - name: search
          in: query
          schema:
            type: string
          description: Search in category name
        - name: all
