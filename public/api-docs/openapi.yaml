              rest_api:
                summary: REST API source
                value:
                  name: Pakistan Hub API
                  type: api
                  is_active: true
                  config:
                    base_url: https://pakistanhub.com
                    endpoint: /api/businesses
                    auth_type: bearer
                    token: your-api-token
                    per_page: 50
                    data_key: data
      responses:
        "201":
          description: Created

  /ecommerce/data-sources/{id}:
    get:
      tags:
        - Data Source Hub
      summary: Get data source detail
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Data source detail with logs
    patch:
      tags:
        - Data Source Hub
      summary: Update data source
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceInput"
      responses:
        "200":
          description: Updated
    delete:
      tags:
        - Data Source Hub
      summary: Delete data source
      parameters:
        - $ref: "#/components/parameters/Id"
