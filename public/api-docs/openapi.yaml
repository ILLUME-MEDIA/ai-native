                    - businesses
                    - menu-items
                    - discovery-users
                    - ecommerce
                  default: ecommerce
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: http://127.0.0.1:8000/storage/ecommerce/businesses/abc123.jpg
                  path:
                    type: string
                    example: ecommerce/businesses/abc123.jpg

  # ── DATA SOURCE HUB ───────────────────────────────────────────────────────

  /ecommerce/data-sources:
