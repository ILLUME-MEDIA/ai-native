      type: object
      properties:
        id:              { type: integer }
        cal_platform_id: { type: integer }
        name:            { type: string }
        email:           { type: string, format: email }
        phone:           { type: string, nullable: true }
        is_active:       { type: boolean }
        metadata:        { type: object, nullable: true }
        created_at:      { type: string, format: date-time }

    CalPlatformUserAuthResponse:
      type: object
      properties:
        success:  { type: boolean, example: true }
        status:   { type: string, enum: [found, created] }
        token:    { type: string, description: "Encrypted auth token — pass as Authorization: Bearer <token>" }
        user:  { $ref: "#/components/schemas/CalPlatformUser" }
        table: { type: string, example: openorg_users }

    CalMeetingPublic:
      type: object
      properties:
        id:                { type: integer }
        cal_platform_id:   { type: integer }
        openorg_user_id:   { type: integer, nullable: true, description: "Matched user ID if found in users table" }
        user_source:       { type: string, nullable: true, description: "Users table name e.g. openorg_users" }
        booking_uid:       { type: string }
        event_type_id:     { type: string, nullable: true }
        title:             { type: string, example: "30 Min Consultation" }
        description:       { type: string, nullable: true }
        attendee_name:     { type: string }
        attendee_email:    { type: string, format: email }
        attendee_timezone: { type: string, nullable: true }
        start_time:        { type: string, format: date-time }
        end_time:          { type: string, format: date-time }
        status:            { type: string, enum: [upcoming, accepted, confirmed, rescheduled, cancelled, completed] }
        meeting_url:       { type: string, nullable: true }
        metadata:          { type: object, nullable: true, description: "Full Cal.com booking payload" }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }

    CalPlatformCard:
      type: object
      properties:
        id:                { type: integer }
        board_id:          { type: integer }
        column_id:         { type: integer }
        column_name:       { type: string, nullable: true }
        column_color:      { type: string, nullable: true }
        title:             { type: string }
        description:       { type: string, nullable: true }
        priority:          { type: string, enum: [low, medium, high, urgent], nullable: true }
        due_date:          { type: string, format: date, nullable: true }
        assignee:          { type: string, nullable: true }
        labels:            { type: array, items: { type: string } }
        position:          { type: integer }
        is_meeting_card:   { type: boolean }
        source_meeting_id: { type: integer, nullable: true }
        metadata:          { type: object, nullable: true, description: "meeting_url, attendee_email, start_time, end_time" }

  # ── SHIPENGINE ──────────────────────────────────────────────────────────────

  SE_AddressInput:
    type: object
    required: [address_line1, city_locality, state_province, postal_code, country_code]
    properties:
      name:            { type: string }
      company_name:    { type: string }
      address_line1:   { type: string, example: "525 S Winchester Blvd" }
      address_line2:   { type: string }
      city_locality:   { type: string, example: "San Jose" }
      state_province:  { type: string, example: "CA" }
      postal_code:     { type: string, example: "95128" }
      country_code:    { type: string, example: "US", minLength: 2, maxLength: 2 }
      phone:           { type: string }
      address_residential_indicator:
        type: string
        enum: [yes, no, unknown]
        default: unknown

  SE_AddressValidationResult:
    type: object
    properties:
      status:           { type: string, enum: [verified, unverified, warning, error] }
      original_address: { $ref: '#/components/schemas/SE_AddressInput' }
      matched_address:  { $ref: '#/components/schemas/SE_AddressInput' }
      messages:
        type: array
        items:
          type: object
          properties:
            code:    { type: string }
            message: { type: string }
            type:    { type: string, enum: [info, warning, error] }

  SE_Weight:
    type: object
    required: [value, unit]
    properties:
      value: { type: number, example: 1.0 }
      unit:  { type: string, enum: [pound, ounce, gram, kilogram] }

  SE_Dimensions:
    type: object
    properties:
      unit:   { type: string, enum: [inch, centimeter] }
      length: { type: number }
      width:  { type: number }
      height: { type: number }

  SE_Package:
    type: object
    required: [weight]
    properties:
      weight:       { $ref: '#/components/schemas/SE_Weight' }
      dimensions:   { $ref: '#/components/schemas/SE_Dimensions' }
      package_code: { type: string, example: "package" }
      insured_value:
        type: object
        properties:
          currency: { type: string, example: "usd" }
          amount:   { type: number }

  SE_ShipmentInput:
    type: object
    required: [ship_to, ship_from, packages]
    properties:
      carrier_id:    { type: string, example: "se-123456" }
      service_code:  { type: string, example: "usps_priority_mail" }
      ship_date:     { type: string, format: date }
      ship_to:       { $ref: '#/components/schemas/SE_AddressInput' }
      ship_from:     { $ref: '#/components/schemas/SE_AddressInput' }
      return_to:     { $ref: '#/components/schemas/SE_AddressInput' }
      confirmation:
        type: string
        enum: [none, delivery, signature, adult_signature, direct_signature]
      packages:
        type: array
        items: { $ref: '#/components/schemas/SE_Package' }
      advanced_options:
        type: object
        description: Carrier-specific options (e.g. bill_to_account, contains_alcohol)

  SE_Carrier:
    type: object
    properties:
      carrier_id:     { type: string }
      carrier_code:   { type: string }
      account_number: { type: string }
      friendly_name:  { type: string }
      nickname:       { type: string }
      primary:        { type: boolean }
      balance:
        type: object
        properties:
          currency: { type: string }
          amount:   { type: number }
      services:
        type: array
        items:
          type: object
          properties:
            carrier_id:    { type: string }
            carrier_code:  { type: string }
            service_code:  { type: string }
            name:          { type: string }
            domestic:      { type: boolean }
            international: { type: boolean }

  SE_Label:
    type: object
    properties:
      label_id:        { type: string }
      status:          { type: string, enum: [processing, completed, error, voided] }
      shipment_id:     { type: string }
      carrier_id:      { type: string }
      service_code:    { type: string }
      tracking_number: { type: string }
      label_download:
        type: object
        properties:
          pdf:  { type: string, format: uri }
          png:  { type: string, format: uri }
          zpl:  { type: string, format: uri }
          href: { type: string, format: uri }
      created_at:  { type: string, format: date-time }
      voided:      { type: boolean }
      voided_at:   { type: string, format: date-time, nullable: true }
      shipment_cost:
        type: object
        properties:
          currency: { type: string }
          amount:   { type: number }
      insurance_cost:
        type: object
        properties:
          currency: { type: string }
          amount:   { type: number }

  MenuCategoryType:
    type: object
    properties:
      id:
        type: integer
        example: 30
      name:
        type: string
        example: Appetizers
      slug:
        type: string
        example: appetizers
      description:
        type: string
        nullable: true
        example: Starters and small plates
      icon:
        type: string
        nullable: true
        description: Tabler icon name or image URL
        example: null
      hover_icon:
        type: string
        nullable: true
        description: Tabler icon name or image URL for hover state
        example: null
      sort_order:
        type: integer
        example: 1
      is_active:
        type: boolean
        example: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  OrderRefund:
    type: object
    properties:
      id:               { type: integer }
      order_id:         { type: integer }
      user_table:       { type: string, example: users }
      user_id:          { type: integer, nullable: true }
      amount:           { type: number, format: float, example: 12.50 }
      issue_type:
        type: string
        enum: [wrong_item, missing_item, damaged, late, quality, other]
      reason:           { type: string }
      status:
        type: string
        enum: [pending, approved, rejected, refunded]
      stripe_refund_id: { type: string, nullable: true, example: "re_3abc..." }
      auto_refunded:    { type: boolean }
      admin_note:       { type: string, nullable: true }
      processed_at:     { type: string, format: date-time, nullable: true }
      created_at:       { type: string, format: date-time }
      updated_at:       { type: string, format: date-time }
      order:
        type: object
        nullable: true
        properties:
          id:             { type: integer }
          order_number:   { type: string }
          total:          { type: number }
          payment_status: { type: string }
          customer_name:  { type: string, nullable: true }
          customer_email: { type: string, nullable: true }

  RefundStats:
    type: object
    properties:
      total:    { type: integer, description: "All refund requests" }
      pending:  { type: integer }
      approved: { type: integer }
      rejected: { type: integer }
      refunded: { type: integer }
      totalAmt: { type: number, format: float, description: "Total amount refunded via Stripe" }

  SupportTicket:
    type: object
    properties:
      id:              { type: integer }
      ticket_number:   { type: string, example: "TKT-AB12CD" }
      order_id:        { type: integer, nullable: true }
      user_table:      { type: string, example: "users" }
      user_id:         { type: integer, nullable: true }
      subject:         { type: string }
      category:        { type: string, enum: [general, refund, delivery, quality, other] }
      status:          { type: string, enum: [open, in_progress, resolved, closed] }
      priority:        { type: string, enum: [low, medium, high, urgent] }
      resolution_note: { type: string, nullable: true }
      resolved_at:     { type: string, format: date-time, nullable: true }
      unread_admin:    { type: integer }
      unread_user:     { type: integer }
      messages_count:  { type: integer }
      created_at:      { type: string, format: date-time }
      updated_at:      { type: string, format: date-time }
      messages:
        type: array
        items:
          type: object
          properties:
            id:          { type: integer }
            ticket_id:   { type: integer }
            sender_type: { type: string, enum: [user, admin] }
            sender_id:   { type: integer, nullable: true }
            message:     { type: string }
            is_read:     { type: boolean }
            created_at:  { type: string, format: date-time }
      order:
        type: object
        nullable: true
        properties:
          id:           { type: integer }
          order_number: { type: string }
          total:        { type: number }
          status:       { type: string }

  SupportStats:
    type: object
    properties:
      total:       { type: integer }
      open:        { type: integer }
      in_progress: { type: integer }
      resolved:    { type: integer }
      closed:      { type: integer }
      unread:      { type: integer, description: "Tickets with unread messages from users" }

  SE_TrackingInfo:
    type: object
    properties:
      tracking_number:       { type: string }
      status_code:           { type: string }
      status_description:    { type: string }
      carrier_code:          { type: string }
      estimated_delivery_at: { type: string, format: date-time, nullable: true }
      actual_delivery_at:    { type: string, format: date-time, nullable: true }
      events:
        type: array
        items:
          type: object
          properties:
            occurred_at:    { type: string, format: date-time }
            description:    { type: string }
            city_locality:  { type: string }
            state_province: { type: string }
            postal_code:    { type: string }
            country_code:   { type: string }
            event_code:     { type: string }
