  /ecommerce/data-sources/{id}/logs:
    get:
      tags:
        - Data Source Hub
      summary: Get last 20 sync logs
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sync logs

  # ── REFUNDS (User-facing) ─────────────────────────────────────────────────

  /ecommerce/my-orders/{order}/refund-request:
    post:
      tags:
        - Refunds
      summary: Submit a refund request for an order
      description: |
        Customer submits a refund request for one of their orders.
        Requires OTP Bearer auth. The order must be paid.

        **Auto-refund**: If `refund_auto_enabled` is true in admin settings
        and the order was paid via Stripe, the refund is processed immediately.
        Otherwise it remains `pending` for admin review.

        **Refund window**: If `refund_window_hours > 0`, requests outside that
        window are rejected.
      security:
        - OtpBearer: []
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: integer }
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_type, reason]
              properties:
                issue_type:
                  type: string
                  enum: [wrong_item, missing_item, damaged, late, quality, other]
                  example: damaged
                reason:
                  type: string
                  maxLength: 1000
                  example: "The food arrived damaged and was not edible."
                amount:
                  type: number
                  format: float
                  description: Partial refund amount. Defaults to the full order total.
                  example: 12.50
      responses:
        "201":
          description: Refund request created (or auto-processed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  refund:
                    $ref: "#/components/schemas/OrderRefund"
        "409":
          description: A refund request already exists for this order
        "422":
          description: Order not paid, or outside refund window

  /ecommerce/my-orders/{order}/refund:
    get:
      tags:
        - Refunds
      summary: Get refund status for a specific order
      security:
        - OtpBearer: []
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Refund status
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_number: { type: string }
                  refund:
                    $ref: "#/components/schemas/OrderRefund"
                    nullable: true

  /ecommerce/my-refunds:
    get:
      tags:
        - Refunds
      summary: List all refund requests for the current user
      security:
        - OtpBearer: []
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated list of user's refund requests

  # ── REFUNDS (Admin) ────────────────────────────────────────────────────────

  /admin/refunds:
    get:
      tags:
        - Admin Refunds
      summary: List all refund requests with filters + stats
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, refunded] }
        - name: issue_type
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
          description: Search by order number, customer name or email
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Paginated refund list + aggregate stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderRefund"
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page:    { type: integer }
                      total:        { type: integer }
                      per_page:     { type: integer }
                  stats:
                    $ref: "#/components/schemas/RefundStats"

  /admin/refunds/stats:
    get:
      tags:
        - Admin Refunds
      summary: Aggregate refund statistics only
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundStats"

  /admin/refunds/{refund}:
    get:
      tags:
        - Admin Refunds
      summary: Get single refund detail (with order items)
      parameters:
        - name: refund
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Refund detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRefund"

  /admin/refunds/{refund}/approve:
    post:
      tags:
        - Admin Refunds
      summary: Approve a refund request
      description: |
        Approves the refund. By default (`process_stripe: true`) it also
        issues the refund via Stripe if a `stripe_payment_intent_id` exists.
        Pass `process_stripe: false` to approve without charging Stripe.
      parameters:
        - name: refund
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_note:
                  type: string
                  maxLength: 500
                process_stripe:
                  type: boolean
                  default: true
                amount:
                  type: number
                  format: float
                  description: Override refund amount (partial refund)
      responses:
        "200":
          description: Refund approved (and Stripe processed if applicable)
        "422":
          description: Refund is not in pending state
        "502":
          description: Stripe API error

  /admin/refunds/{refund}/reject:
    post:
      tags:
        - Admin Refunds
      summary: Reject a refund request
      parameters:
        - name: refund
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admin_note]
              properties:
                admin_note:
                  type: string
                  description: Required reason for rejection shown to admin log
      responses:
        "200":
          description: Refund rejected

  /admin/refunds/{refund}/process-stripe:
    post:
      tags:
        - Admin Refunds
      summary: Manually trigger Stripe refund for an approved request
      description: |
        Use when a refund was approved without Stripe processing (`process_stripe: false`)
        and you later want to issue the Stripe refund.
      parameters:
        - name: refund
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stripe refund issued
        "422":
          description: Refund not in approved state or no Stripe payment
        "502":
          description: Stripe API error

  # ── ADMIN SUPPORT / ISSUE MANAGER ────────────────────────────────────────

  /admin/support/tickets:
    get:
      tags:
        - Admin Support
      summary: List support tickets (paginated + stats)
      parameters:
        - { name: status,    in: query, schema: { type: string, enum: [open, in_progress, resolved, closed] } }
        - { name: priority,  in: query, schema: { type: string, enum: [low, medium, high, urgent] } }
        - { name: category,  in: query, schema: { type: string, enum: [general, refund, delivery, quality, other] } }
        - { name: search,    in: query, schema: { type: string }, description: "Search subject, ticket_number, order_number, customer" }
        - { name: page,      in: query, schema: { type: integer, default: 1 } }
        - { name: per_page,  in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Paginated ticket list with stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { type: array, items: { $ref: '#/components/schemas/SupportTicket' } }
                  meta:  { $ref: '#/components/schemas/PaginationMeta' }
                  stats: { $ref: '#/components/schemas/SupportStats' }

  /admin/support/tickets/stats:
    get:
      tags:
        - Admin Support
      summary: Ticket counts only
      responses:
        "200":
          description: Ticket stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportStats' }

  /admin/support/tickets/{ticket}:
    get:
      tags:
        - Admin Support
      summary: Get full ticket with messages
      description: Also marks all user messages as read and resets unread_admin counter.
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }

  /admin/support/tickets/{ticket}/reply:
    post:
      tags:
        - Admin Support
      summary: Send admin reply message
      description: Automatically transitions ticket from `open` → `in_progress` on first reply.
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Reply sent, returns updated ticket with messages

  /admin/support/tickets/{ticket}/status:
    patch:
      tags:
        - Admin Support
      summary: Change status and/or priority
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:   { type: string, enum: [open, in_progress, resolved, closed] }
                priority: { type: string, enum: [low, medium, high, urgent] }
      responses:
        "200":
          description: Ticket updated

  /admin/support/tickets/{ticket}/resolve:
    post:
      tags:
        - Admin Support
      summary: Mark ticket resolved with a resolution note
      description: Sets status to `resolved`, records resolution_note and resolved_at, adds a system message visible to the user.
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_note]
              properties:
                resolution_note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Ticket resolved

  /admin/support/tickets/{ticket}/close:
    post:
      tags:
        - Admin Support
      summary: Close a ticket
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Ticket closed

  # ── USER SUPPORT (CUSTOMER) ───────────────────────────────────────────────

  /ecommerce/support/tickets:
    get:
      tags:
        - User Support
      summary: List my support tickets
      description: Returns tickets for the authenticated user (OTP Bearer) or tickets linked to the session's orders.
      parameters:
        - { name: per_page, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Paginated ticket list
    post:
      tags:
        - User Support
      summary: Open a new support ticket
      description: |
        Create a support ticket. Provide either `message` (free text) or `affected_items` (structured
        item list from the order picker UI) — or both. When only `affected_items` is sent, the backend
        auto-generates the message body:

        ```
        Affected items:
        - Chicken Biryani x2 (Extra Raita, Medium)
        - Vegetable Pulao (Raita)

        ORD-15AALFWP
        ```

        The order number is appended automatically when `order_id` is linked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                order_id:
                  type: integer
                  nullable: true
                  description: ID of the related order (optional). Ownership is verified; silently unlinked on mismatch.
                subject:
                  type: string
                  maxLength: 200
                  example: "I would like to request a refund"
                category:
                  type: string
                  enum: [general, refund, delivery, quality, other]
                  default: general
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                  default: medium
                message:
                  type: string
                  maxLength: 2000
                  nullable: true
                  description: Free-text message. Auto-generated from affected_items when omitted.
                affected_items:
                  type: array
                  nullable: true
                  maxItems: 50
                  description: Structured list of affected order items selected in the frontend picker. Stored as JSON on the ticket for admin review.
                  items:
                    type: object
                    required: [name]
                    properties:
                      order_item_id: { type: integer, nullable: true, description: "ID from order_items table" }
                      menu_item_id:  { type: integer, nullable: true }
                      name:          { type: string, maxLength: 200, example: "Chicken Biryani" }
                      quantity:      { type: integer, minimum: 1, default: 1 }
                      modifiers:
                        type: array
                        items: { type: string, maxLength: 100 }
                        example: ["Extra Raita", "Medium"]
            examples:
              with_affected_items:
                summary: Frontend item-picker (no manual message needed)
                value:
                  order_id: 49
                  subject: "I would like to request a refund"
                  category: refund
                  priority: medium
                  affected_items:
                    - order_item_id: 12
                      menu_item_id: 45
                      name: "Chicken Biryani"
                      quantity: 1
                      modifiers: ["Extra Raita", "Medium"]
                    - order_item_id: 13
                      menu_item_id: 67
                      name: "Vegetable Pulao"
                      quantity: 1
                      modifiers: ["Raita"]
              manual_message:
                summary: Free-text message only (backward compatible)
                value:
                  order_id: 49
                  subject: "I would like to request a refund"
                  category: refund
                  priority: medium
                  message: "Affected items:\n- Chicken Biryani (Extra Raita, Medium)\n- Vegetable Pulao (Raita)\n\nORD-15AALFWP"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Support ticket created." }
                  ticket:
                    type: object
                    properties:
                      id:             { type: integer }
                      ticket_number:  { type: string, example: "TKT-A1B2C3" }
                      subject:        { type: string }
                      category:       { type: string }
                      priority:       { type: string }
                      status:         { type: string, example: "open" }
                      order_id:       { type: integer, nullable: true }
                      affected_items:
                        type: array
                        nullable: true
                        items: { type: object }
                      messages:
                        type: array
                        items:
                          type: object
                          properties:
                            id:          { type: integer }
                            sender_type: { type: string, enum: [user, admin] }
                            message:     { type: string }
                            created_at:  { type: string, format: date-time }
        "422":
          description: Validation error or missing message/affected_items

  /ecommerce/support/tickets/{ticket}:
    get:
      tags:
        - User Support
      summary: View ticket + messages
      description: Marks admin messages as read and resets unread_user counter.
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Ticket with messages
        "404":
          description: Ticket not found / not owned by caller

  /ecommerce/support/tickets/{ticket}/messages:
    post:
      tags:
        - User Support
      summary: Send a message on a ticket
      description: Blocked if ticket is resolved or closed.
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Message sent
        "422":
          description: Ticket is closed/resolved

  /ecommerce/support/tickets/{ticket}/close:
    post:
      tags:
        - User Support
      summary: Close ticket (user action)
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Ticket closed

  # ── STRIPE PAYMENTS ───────────────────────────────────────────────────────

  /payment/stripe/config:
    get:
      tags:
        - Stripe Payments
      summary: Get Stripe publishable key
      description: |
        Returns the Stripe publishable key for initialising Stripe.js on the frontend.
        Call this if `VITE_STRIPE_PUBLISHABLE_KEY` is not set in the build environment.

        **No auth required.**

        ```js
        // Usage in checkout
        const res = await axios.get('/api/payment/stripe/config');
        const stripe = Stripe(res.data.publishable_key);
        ```
      security: []
      responses:
        "200":
          description: Stripe publishable key
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishable_key:
                    type: string
                    example: "pk_test_51..."
                    description: Stripe publishable key (empty string if Stripe not configured)

  /payment/stripe/setup-intent:
    post:
      tags:
        - Stripe Payments
      summary: Step 1 — Create SetupIntent (to save card without charging)
      description: |
        Creates a Stripe SetupIntent. Use the returned `client_secret` on the frontend
        with `stripe.confirmCardSetup()` to securely collect and confirm the card.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: SetupIntent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  client_secret:
                    type: string
                    example: seti_1...secret_...
                    description: Pass this to stripe.confirmCardSetup() on the frontend
                  stripe_customer_id:
                    type: string
                    example: cus_abc123
        "401":
          description: OTP token missing or expired

  /payment/stripe/save-method:
    post:
      tags:
        - Stripe Payments
      summary: Step 2 — Save payment method after confirmCardSetup
      description: |
        After the frontend calls `stripe.confirmCardSetup()` and gets a `payment_method` id,
        call this endpoint to attach it to the customer and save it in the database.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_method_id
              properties:
                payment_method_id:
                  type: string
                  example: pm_1ABC...
                  description: The payment_method id from Stripe (starts with pm_)
                set_default:
                  type: boolean
                  default: false
                  description: Whether to set this as the default payment method
            example:
              payment_method_id: pm_1ABC...
              set_default: true
      responses:
        "201":
          description: Payment method saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_method:
                    $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired
        "422":
          description: Validation error

  /payment/stripe/methods:
    get:
      tags:
        - Stripe Payments
      summary: List saved payment methods
      description: |
        Returns all saved cards for the authenticated user.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: List of saved payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_methods:
                    type: array
                    items:
                      $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired

  /payment/stripe/methods/{id}:
    delete:
      tags:
        - Stripe Payments
      summary: Delete a saved payment method
      description: |
        Detaches the payment method from Stripe and removes it from the database.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Local DB id of the payment method (from list response)
      responses:
        "200":
          description: Payment method removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment method removed.
        "401":
          description: OTP token missing or expired
        "404":
          description: Payment method not found or does not belong to this user

  /payment/stripe/methods/{id}/set-default:
    post:
      tags:
        - Stripe Payments
      summary: Set a payment method as default
      description: |
        Marks the specified payment method as the default for future charges.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Local DB id of the payment method
      responses:
        "200":
          description: Default updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_method:
                    $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired
        "404":
          description: Payment method not found

  /payment/stripe/charge:
    post:
      tags:
        - Stripe Payments
      summary: Charge a saved card for an order
      description: |
        Charges the customer's saved card for an existing order.
        Uses the default payment method unless `payment_method_id` is specified.

        On success, the order's `payment_status` is set to `paid`.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
              properties:
                order_id:
                  type: integer
                  description: ID of the order to charge
                  example: 42
                payment_method_id:
                  type: string
                  description: Stripe pm_ id to use (optional — uses default if omitted)
                  example: pm_1ABC...
            example:
              order_id: 42
      responses:
        "200":
          description: Charge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_status:
                    type: string
                    enum:
                      - paid
                      - failed
                  payment_intent_id:
                    type: string
                    example: pi_1ABC...
                  amount_charged:
                    type: number
                    example: 29.99
                  order_number:
                    type: string
                    example: ORD-A1B2C3D4
        "401":
          description: OTP token missing or expired
        "409":
          description: Order is already paid
        "422":
          description: No saved payment method found — save a card first

  /payment/stripe/webhook:
    post:
      tags:
        - Stripe Payments
      summary: Stripe webhook receiver
      description: |
        Stripe sends payment events to this endpoint.
        Configure this URL in your **Stripe Dashboard → Developers → Webhooks**.

        **Supported events:**
        - `payment_intent.succeeded` → sets order `payment_status` to `paid`
        - `payment_intent.payment_failed` → sets order `payment_status` to `failed`

        Requires `STRIPE_WEBHOOK_SECRET` in `.env` for signature verification.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Stripe webhook signature header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload
      responses:
        "200":
          description: Event processed
        "400":
          description: Invalid signature or malformed event

  # ── DOORDASH ────────────────────────────────────────────────────────────────

  /delivery/doordash/env:
    get:
      tags:
        - DoorDash Delivery
      summary: Get current DoorDash environment
      description: Returns whether the service is running in `sandbox` or `production` mode.
      security: []
      responses:
        "200":
          description: Environment info
          content:
            application/json:
              schema:
                type: object
                properties:
                  env:
                    type: string
                    enum: [sandbox, production]
                    example: sandbox
                  is_sandbox:
                    type: boolean
                    example: true

  /delivery/doordash/quote:
    post:
      tags:
        - DoorDash Delivery
      summary: Get DoorDash delivery fee quote
      description: |
        Returns a delivery fee estimate directly from DoorDash (no order created).

        **3-attempt fallback chain:**
        1. `POST /drive/v1/estimates` — Classic Drive API (fee + tax + ETA, non-binding).
        2. `POST /drive/v2/deliveries/quotes` — Drive API v2 for newer accounts.
        3. `POST /drive/v2/deliveries` + immediate cancel — last resort for v2 accounts where `/quotes` is disabled.

        Pass real phone numbers to improve DoorDash validation and avoid placeholder rejections.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dropoff_address
              properties:
                pickup_address:
                  type: string
                  description: Optional if `business_id` provided — auto-built from business saved address
                  example: "123 Main St, Los Angeles, CA 90012"
                dropoff_address:
                  type: string
                  description: Customer delivery address (required)
                  example: "456 Oak Ave, Los Angeles, CA 90001"
                order_value:
                  type: number
                  description: Order subtotal in dollars
                  example: 35.50
                pickup_phone:
                  type: string
                  description: Pickup contact phone (any format — normalized to E.164 internally)
                  example: "+13235551234"
                dropoff_phone:
                  type: string
                  description: Dropoff contact phone (any format — normalized to E.164 internally)
                  example: "+13105551234"
            examples:
              minimal:
                summary: Addresses only
                value:
                  pickup_address: "2309 San Pablo Avenue, Berkeley, CA 94702"
                  dropoff_address: "2301 San Pablo Avenue, Berkeley, CA 94702"
                  order_value: 35.50
              with_phones:
                summary: With real phone numbers
                value:
                  pickup_address: "2309 San Pablo Avenue, Berkeley, CA 94702"
                  dropoff_address: "2301 San Pablo Avenue, Berkeley, CA 94702"
                  order_value: 35.50
                  pickup_phone: "+15105551234"
                  dropoff_phone: "+13105551234"
      responses:
        "200":
          description: Quote result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  fee:
                    type: number
                    nullable: true
                    description: Delivery fee in dollars
                    example: 5.99
                  fee_cents:
                    type: integer
                    nullable: true
                    example: 599
                  tax:
                    type: number
                    nullable: true
                    description: Tax in dollars (Classic Drive API only)
                    example: 0.52
                  tax_cents:
                    type: integer
                    nullable: true
                    example: 52
                  currency:
                    type: string
                    example: USD
                  estimated_minutes:
                    type: integer
                    nullable: true
                    example: 42
                  pickup_time:
                    type: string
                    format: date-time
                    nullable: true
                  delivery_time:
                    type: string
                    format: date-time
                    nullable: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  quote_id:
                    type: string
                    nullable: true
                    example: "48173944"
                  raw:
                    type: object
                    description: Raw DoorDash API response
        "502":
          description: DoorDash API error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Validation Failed"

  /delivery/doordash/status/{order}:
    get:
      tags:
        - DoorDash Delivery
      summary: Get live delivery status
      description: |
        Fetches the current delivery status from DoorDash and syncs it to the local order.
        Also updates the order status (`out_for_delivery`, `delivered`, `cancelled`) automatically.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "200":
          description: Delivery status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  order_number:
                    type: string
                    example: ORD-ABC12345
                  dd_status:
                    type: string
                    example: enroute_to_pickup
                  dd_label:
                    type: string
                    example: Dasher Heading to Restaurant
                  tracking_url:
                    type: string
                    nullable: true
                    example: https://doordash.com/track/...
                  delivery:
                    type: object
                    description: Full DoorDash delivery object
        "404":
          description: No DoorDash delivery for this order
        "502":
          description: DoorDash API error

  /delivery/doordash/dispatch/{order}:
    post:
      tags:
        - DoorDash Delivery
      summary: Manually dispatch a DoorDash delivery
      description: |
        Manually creates a DoorDash delivery for an order. Useful when auto-dispatch failed
        at order creation time. Returns 409 if a delivery was already dispatched.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "201":
          description: Delivery dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  delivery_id:
                    type: string
                    example: ORD-ABC12345
                  status:
                    type: string
                    example: created
                  label:
                    type: string
                    example: Order Received
                  tracking_url:
                    type: string
                    nullable: true
        "409":
          description: DoorDash delivery already exists for this order
        "422":
          description: Order has no delivery address
        "502":
          description: DoorDash API error

  /delivery/doordash/cancel/{order}:
    post:
      tags:
        - DoorDash Delivery
      summary: Cancel a DoorDash delivery
      description: |
        Cancels an active DoorDash delivery and sets the order status to `cancelled`.
        Returns 409 if the delivery is already completed or cancelled.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "200":
          description: Delivery cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: DoorDash delivery cancelled.
        "404":
          description: No DoorDash delivery for this order
        "409":
          description: Delivery cannot be cancelled (already delivered / cancelled)
        "502":
          description: DoorDash API error

  /delivery/doordash/webhook:
    post:
      tags:
        - DoorDash Delivery
      summary: DoorDash webhook receiver
      description: |
        DoorDash sends delivery status updates to this endpoint.
        Configure this URL in the **DoorDash Developer Portal → Webhooks**.

        **Status mappings:**
        | DoorDash status | Order status |
        |---|---|
        | `enroute_to_pickup` | `preparing` |
        | `arrived_at_pickup` | `ready` |
        | `picked_up` / `enroute_to_dropoff` | `out_for_delivery` |
        | `delivered` | `delivered` |
        | `delivery_cancelled` / `returned` | `cancelled` |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_delivery_id:
                  type: string
                  example: ORD-ABC12345
                  description: Matches the order_number
                delivery_status:
                  type: string
                  example: picked_up
                tracking_url:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Webhook processed

  # ── DELIVERY QUOTE (UNIFIED) ───────────────────────────────────────────────

  /delivery/quote:
    post:
      tags:
        - Delivery Quote
      summary: Get delivery fee quote (single or multi-vendor)
      description: |
        Unified delivery quote endpoint. Supports two modes:

        **Single-vendor mode** — pass `vendor` (string):
        Routes to one provider and returns a single `DeliveryQuoteResponse`.

        **Multi-vendor mode** — pass `vendors` (array):
        Queries all specified vendors in one request and returns all quotes plus the cheapest.
        Response shape: `{ success, mode: "multi", quotes: {vendor: quote, ...}, cheapest: "vendor", cheapest_quote: {...} }`

        | Vendor | Notes |
        |--------|-------|
        | `doordash` | Real fee + tax + ETA via Drive v1/estimates API |
        | `uber_direct` | Real fee + ETA via Uber Direct quotes API |
        | `ubereats` | Zone-based estimate (UberEats manages final fee at checkout) |
        | `instacart` | Zone-based estimate (Instacart manages final fee) |
        | `own` | Exact fee from delivery zone config |
        | `shipengine` | Cheapest rate from connected carriers |

        ### DoorDash Quote Strategy (3-attempt fallback chain)
        1. `POST /drive/v1/estimates` — Classic Drive API. Returns `fee`, `tax`, `pickup_time`, `delivery_time` without creating a delivery.
        2. `POST /drive/v2/deliveries/quotes` — Drive API v2. Used for newer accounts that don't have Classic Drive.
        3. `POST /drive/v2/deliveries` + immediate cancel — Last resort for v2 accounts where the quotes endpoint is disabled.

        Pass `business_id` to automatically use the business's phone for the pickup contact.
        Pass `customer_phone` to use the real customer phone for the dropoff contact (improves DoorDash validation).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendor:
                  type: string
                  enum: [doordash, uber_direct, ubereats, instacart, own, shipengine]
                  description: Single vendor key (use this OR `vendors`, not both)
                  example: uber_direct
                vendors:
                  type: array
                  description: Multiple vendor keys — triggers multi-vendor mode (use this OR `vendor`, not both)
                  items:
                    type: string
                    enum: [doordash, uber_direct, ubereats, instacart, own, shipengine]
                  example: [doordash, uber_direct]
                pickup_address:
                  type: string
                  description: |
                    Pickup address. Optional if `business_id` is provided —
                    the business's saved address is used automatically (works for doordash and uber_direct).
                  example: '{"street_address":["100 Market St"],"city":"San Francisco","state":"CA","zip_code":"94105","country":"US"}'
                dropoff_address:
                  type: string
                  description: Dropoff (customer) address — required for doordash / uber_direct
                  example: "456 Oak Ave, Los Angeles, CA 90001"
                order_value:
                  type: number
                  description: Order subtotal in dollars (used for DoorDash fee calculation)
                  example: 35.50
                business_id:
                  type: integer
                  description: |
                    Required for ubereats / instacart / own.
                    For doordash / uber_direct: auto-fills `pickup_address` from the business's saved address
                    and uses the business phone as the pickup contact.
                  example: 1
                lat:
                  type: number
                  description: Customer latitude (for zone matching with own/ubereats/instacart)
                  example: 34.0522
                lng:
                  type: number
                  description: Customer longitude (for zone matching)
                  example: -118.2437
                customer_phone:
                  type: string
                  description: Customer phone number (doordash only — used as dropoff contact, any format accepted)
                  example: "+13105551234"
      responses:
        "200":
          description: Quote result (single or multi-vendor)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeliveryQuoteResponse"
                  - $ref: "#/components/schemas/MultiDeliveryQuoteResponse"
              examples:
                single_doordash:
                  summary: Single-vendor — DoorDash response
                  value:
                    success: true
                    vendor: doordash
                    fee: 5.99
                    fee_cents: 599
                    tax: 0.52
                    tax_cents: 52
                    currency: USD
                    estimated_minutes: 42
                    pickup_time: "2026-03-02T17:30:00Z"
                    delivery_time: "2026-03-02T18:12:00Z"
                    quote_id: "48173944"
                    min_order_amount: 0
                    expires_at: null
                    zone: null
                multi_vendor:
                  summary: Multi-vendor — cheapest automatically selected
                  value:
                    success: true
                    mode: multi
                    cheapest: doordash
                    cheapest_quote:
                      success: true
                      vendor: doordash
                      fee: 5.99
                      fee_cents: 599
                      currency: USD
                      estimated_minutes: 42
                    quotes:
                      doordash:
                        success: true
                        vendor: doordash
                        fee: 5.99
                        fee_cents: 599
                        currency: USD
                        estimated_minutes: 42
                      uber_direct:
                        success: true
                        vendor: uber_direct
                        fee: 7.50
                        fee_cents: 750
                        currency: USD
                        estimated_minutes: 30
                own_delivery:
                  summary: Single-vendor — Own delivery zone response
                  value:
                    success: true
                    vendor: own
                    fee: 3.99
                    fee_cents: 399
                    currency: USD
                    estimated_minutes: 30
                    min_order_amount: 15.00
                    in_zone: true
                    zone:
                      id: 1
                      name: Downtown LA
                      description: "5 mile radius"
        "422":
          description: Missing required fields or no valid vendors specified

  # ── TAX LOOKUP ───────────────────────────────────────────────────────────────

  /ecommerce/tax:
    get:
      tags:
        - Tax
      summary: Look up sales tax by ZIP code (GET)
      description: |
        Returns the US sales tax rate for a given 5-digit ZIP code.
        Optionally calculates the tax amount if `subtotal` is provided.

        Data source: Avalara ZIP-based tax rate tables (March 2026).
        Covers all 50 US states, DC, and Puerto Rico.

        **Workflow:**
        1. Call this endpoint with the delivery ZIP code and order subtotal
        2. Use `tax_rate` (a decimal like `0.0975`) — convert to percentage for checkout: `tax_rate * 100`
        3. Pass that percentage as `tax_rate` to `POST /api/ecommerce/checkout`

        **Risk level:** ZIP codes spanning multiple tax jurisdictions have `risk_level > 0`.
        The returned rate may vary by ±5% for those cases.
      security: []
      parameters:
        - name: zip
          in: query
          required: true
          description: 5-digit US ZIP code
          schema:
            type: string
            pattern: '^\d{5}$'
            example: "90001"
        - name: subtotal
          in: query
          required: false
          description: Order subtotal in dollars — used to calculate tax_amount and total
          schema:
            type: number
            format: float
            example: 100.00
      responses:
        "200":
          description: Tax data for the ZIP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxResponse"
              examples:
                los_angeles:
                  summary: Los Angeles, CA (90001) — $100 subtotal
                  value:
                    success: true
                    data:
                      found: true
                      zip_code: "90001"
                      tax_region: "HUNTINGTON PARK"
                      state: "CA"
                      tax_rate: 0.105
                      tax_percentage: "10.5000%"
                      tax_amount: "10.50"
                      subtotal: "100.00"
                      total: "110.50"
                      risk_level: 0
                      breakdown:
                        state_rate: 0.06
                        county_rate: 0.0025
                        city_rate: 0.0075
                        special_rate: 0.035
                no_tax_state:
                  summary: Anchorage, AK (99501) — zero sales tax
                  value:
                    success: true
                    data:
                      found: true
                      zip_code: "99501"
                      tax_region: "ANCHORAGE BOROUGH"
                      state: "AK"
                      tax_rate: 0.0
                      tax_percentage: "0.0000%"
                      tax_amount: "0.00"
                      subtotal: "100.00"
                      total: "100.00"
                      risk_level: 0
                      breakdown:
                        state_rate: 0.0
                        county_rate: 0.0
                        city_rate: 0.0
                        special_rate: 0.0
        "404":
          description: ZIP code not found in tax database
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "No tax data found for ZIP code 00000. It may not exist or may be outside the US."
        "422":
          description: Validation error — invalid ZIP format

    post:
      tags:
        - Tax
      summary: Look up sales tax by ZIP code (POST)
      description: |
        Same as GET `/ecommerce/tax` but accepts a JSON body.
        Useful when building mobile apps or passing data from a form.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - zip
              properties:
                zip:
                  type: string
                  pattern: '^\d{5}$'
                  description: 5-digit US ZIP code
                  example: "10001"
                subtotal:
                  type: number
                  format: float
                  description: Order subtotal in dollars
                  example: 75.50
            example:
              zip: "10001"
              subtotal: 75.50
      responses:
        "200":
          description: Tax data for the ZIP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxResponse"
              example:
                success: true
                data:
                  found: true
                  zip_code: "10001"
                  tax_region: "NEW YORK CITY"
                  state: "NY"
                  tax_rate: 0.08875
                  tax_percentage: "8.8750%"
                  tax_amount: "6.70"
                  subtotal: "75.50"
                  total: "82.20"
                  risk_level: 0
                  breakdown:
                    state_rate: 0.04
                    county_rate: 0.0
                    city_rate: 0.045
                    special_rate: 0.00375
        "404":
          description: ZIP code not found
        "422":
          description: Validation error

