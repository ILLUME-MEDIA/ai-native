  # ── STRIPE PAYMENTS ───────────────────────────────────────────────────────

  /payment/stripe/config:
    get:
      tags:
        - Stripe Payments
      summary: Get Stripe publishable key
      description: |
        Returns the Stripe publishable key for initialising Stripe.js on the frontend.
        Call this if `VITE_STRIPE_PUBLISHABLE_KEY` is not set in the build environment.

        **No auth required.**

        ```js
        // Usage in checkout
        const res = await axios.get('/api/payment/stripe/config');
        const stripe = Stripe(res.data.publishable_key);
        ```
      security: []
      responses:
        "200":
          description: Stripe publishable key
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishable_key:
                    type: string
                    example: "pk_test_51..."
                    description: Stripe publishable key (empty string if Stripe not configured)

  /payment/stripe/setup-intent:
    post:
      tags:
        - Stripe Payments
      summary: Step 1 — Create SetupIntent (to save card without charging)
      description: |
        Creates a Stripe SetupIntent. Use the returned `client_secret` on the frontend
        with `stripe.confirmCardSetup()` to securely collect and confirm the card.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: SetupIntent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  client_secret:
                    type: string
                    example: seti_1...secret_...
                    description: Pass this to stripe.confirmCardSetup() on the frontend
                  stripe_customer_id:
                    type: string
                    example: cus_abc123
        "401":
          description: OTP token missing or expired

  /payment/stripe/save-method:
    post:
      tags:
        - Stripe Payments
      summary: Step 2 — Save payment method after confirmCardSetup
      description: |
        After the frontend calls `stripe.confirmCardSetup()` and gets a `payment_method` id,
        call this endpoint to attach it to the customer and save it in the database.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_method_id
              properties:
                payment_method_id:
                  type: string
                  example: pm_1ABC...
                  description: The payment_method id from Stripe (starts with pm_)
                set_default:
                  type: boolean
                  default: false
                  description: Whether to set this as the default payment method
            example:
              payment_method_id: pm_1ABC...
              set_default: true
      responses:
        "201":
          description: Payment method saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_method:
                    $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired
        "422":
          description: Validation error

  /payment/stripe/methods:
    get:
      tags:
        - Stripe Payments
      summary: List saved payment methods
      description: |
        Returns all saved cards for the authenticated user.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      responses:
        "200":
          description: List of saved payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_methods:
                    type: array
                    items:
                      $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired

  /payment/stripe/methods/{id}:
    delete:
      tags:
        - Stripe Payments
      summary: Delete a saved payment method
      description: |
        Detaches the payment method from Stripe and removes it from the database.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Local DB id of the payment method (from list response)
      responses:
        "200":
          description: Payment method removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment method removed.
        "401":
          description: OTP token missing or expired
        "404":
          description: Payment method not found or does not belong to this user

  /payment/stripe/methods/{id}/set-default:
    post:
      tags:
        - Stripe Payments
      summary: Set a payment method as default
      description: |
        Marks the specified payment method as the default for future charges.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Local DB id of the payment method
      responses:
        "200":
          description: Default updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_method:
                    $ref: "#/components/schemas/StripePaymentMethod"
        "401":
          description: OTP token missing or expired
        "404":
          description: Payment method not found

  /payment/stripe/charge:
    post:
      tags:
        - Stripe Payments
      summary: Charge a saved card for an order
      description: |
        Charges the customer's saved card for an existing order.
        Uses the default payment method unless `payment_method_id` is specified.

        On success, the order's `payment_status` is set to `paid`.

        **Auth:** `Authorization: Bearer <otp-token>`
      security:
        - otpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
              properties:
                order_id:
                  type: integer
                  description: ID of the order to charge
                  example: 42
                payment_method_id:
                  type: string
                  description: Stripe pm_ id to use (optional — uses default if omitted)
                  example: pm_1ABC...
            example:
              order_id: 42
      responses:
        "200":
          description: Charge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment_status:
                    type: string
                    enum:
                      - paid
                      - failed
                  payment_intent_id:
                    type: string
                    example: pi_1ABC...
                  amount_charged:
                    type: number
                    example: 29.99
                  order_number:
                    type: string
                    example: ORD-A1B2C3D4
        "401":
          description: OTP token missing or expired
        "409":
          description: Order is already paid
        "422":
          description: No saved payment method found — save a card first

  /payment/stripe/webhook:
    post:
      tags:
        - Stripe Payments
      summary: Stripe webhook receiver
      description: |
        Stripe sends payment events to this endpoint.
        Configure this URL in your **Stripe Dashboard → Developers → Webhooks**.

        **Supported events:**
        - `payment_intent.succeeded` → sets order `payment_status` to `paid`
        - `payment_intent.payment_failed` → sets order `payment_status` to `failed`

        Requires `STRIPE_WEBHOOK_SECRET` in `.env` for signature verification.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Stripe webhook signature header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload
      responses:
        "200":
          description: Event processed
        "400":
          description: Invalid signature or malformed event

  # ── DOORDASH ────────────────────────────────────────────────────────────────

  /delivery/doordash/env:
    get:
      tags:
        - DoorDash Delivery
      summary: Get current DoorDash environment
      description: Returns whether the service is running in `sandbox` or `production` mode.
      security: []
      responses:
        "200":
          description: Environment info
          content:
            application/json:
              schema:
                type: object
                properties:
                  env:
                    type: string
                    enum: [sandbox, production]
                    example: sandbox
                  is_sandbox:
                    type: boolean
                    example: true

  /delivery/doordash/quote:
    post:
      tags:
        - DoorDash Delivery
      summary: Get DoorDash delivery fee quote
      description: |
        Returns a delivery fee estimate directly from DoorDash (no order created).

        **3-attempt fallback chain:**
        1. `POST /drive/v1/estimates` — Classic Drive API (fee + tax + ETA, non-binding).
        2. `POST /drive/v2/deliveries/quotes` — Drive API v2 for newer accounts.
        3. `POST /drive/v2/deliveries` + immediate cancel — last resort for v2 accounts where `/quotes` is disabled.

        Pass real phone numbers to improve DoorDash validation and avoid placeholder rejections.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dropoff_address
              properties:
                pickup_address:
                  type: string
                  description: Optional if `business_id` provided — auto-built from business saved address
                  example: "123 Main St, Los Angeles, CA 90012"
                dropoff_address:
                  type: string
                  description: Customer delivery address (required)
                  example: "456 Oak Ave, Los Angeles, CA 90001"
                order_value:
                  type: number
                  description: Order subtotal in dollars
                  example: 35.50
                pickup_phone:
                  type: string
                  description: Pickup contact phone (any format — normalized to E.164 internally)
                  example: "+13235551234"
                dropoff_phone:
                  type: string
                  description: Dropoff contact phone (any format — normalized to E.164 internally)
                  example: "+13105551234"
            examples:
              minimal:
                summary: Addresses only
                value:
                  pickup_address: "2309 San Pablo Avenue, Berkeley, CA 94702"
                  dropoff_address: "2301 San Pablo Avenue, Berkeley, CA 94702"
                  order_value: 35.50
              with_phones:
                summary: With real phone numbers
                value:
                  pickup_address: "2309 San Pablo Avenue, Berkeley, CA 94702"
                  dropoff_address: "2301 San Pablo Avenue, Berkeley, CA 94702"
                  order_value: 35.50
                  pickup_phone: "+15105551234"
                  dropoff_phone: "+13105551234"
      responses:
        "200":
          description: Quote result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  fee:
                    type: number
                    nullable: true
                    description: Delivery fee in dollars
                    example: 5.99
                  fee_cents:
                    type: integer
                    nullable: true
                    example: 599
                  tax:
                    type: number
                    nullable: true
                    description: Tax in dollars (Classic Drive API only)
                    example: 0.52
                  tax_cents:
                    type: integer
                    nullable: true
                    example: 52
                  currency:
                    type: string
                    example: USD
                  estimated_minutes:
                    type: integer
                    nullable: true
                    example: 42
                  pickup_time:
                    type: string
                    format: date-time
                    nullable: true
                  delivery_time:
                    type: string
                    format: date-time
                    nullable: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  quote_id:
                    type: string
                    nullable: true
                    example: "48173944"
                  raw:
                    type: object
                    description: Raw DoorDash API response
        "502":
          description: DoorDash API error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Validation Failed"

  /delivery/doordash/status/{order}:
    get:
      tags:
        - DoorDash Delivery
      summary: Get live delivery status
      description: |
        Fetches the current delivery status from DoorDash and syncs it to the local order.
        Also updates the order status (`out_for_delivery`, `delivered`, `cancelled`) automatically.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "200":
          description: Delivery status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  order_number:
                    type: string
                    example: ORD-ABC12345
                  dd_status:
                    type: string
                    example: enroute_to_pickup
                  dd_label:
                    type: string
                    example: Dasher Heading to Restaurant
                  tracking_url:
                    type: string
                    nullable: true
                    example: https://doordash.com/track/...
                  delivery:
                    type: object
                    description: Full DoorDash delivery object
        "404":
          description: No DoorDash delivery for this order
        "502":
          description: DoorDash API error

  /delivery/doordash/dispatch/{order}:
    post:
      tags:
        - DoorDash Delivery
      summary: Manually dispatch a DoorDash delivery
      description: |
        Manually creates a DoorDash delivery for an order. Useful when auto-dispatch failed
        at order creation time. Returns 409 if a delivery was already dispatched.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "201":
          description: Delivery dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  delivery_id:
                    type: string
                    example: ORD-ABC12345
                  status:
                    type: string
                    example: created
                  label:
                    type: string
                    example: Order Received
                  tracking_url:
                    type: string
                    nullable: true
        "409":
          description: DoorDash delivery already exists for this order
        "422":
          description: Order has no delivery address
        "502":
          description: DoorDash API error

  /delivery/doordash/cancel/{order}:
    post:
      tags:
        - DoorDash Delivery
      summary: Cancel a DoorDash delivery
      description: |
        Cancels an active DoorDash delivery and sets the order status to `cancelled`.
        Returns 409 if the delivery is already completed or cancelled.
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
          description: Local order ID
      responses:
        "200":
          description: Delivery cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: DoorDash delivery cancelled.
        "404":
          description: No DoorDash delivery for this order
        "409":
          description: Delivery cannot be cancelled (already delivered / cancelled)
        "502":
          description: DoorDash API error

  /delivery/doordash/webhook:
    post:
      tags:
        - DoorDash Delivery
      summary: DoorDash webhook receiver
      description: |
        DoorDash sends delivery status updates to this endpoint.
        Configure this URL in the **DoorDash Developer Portal → Webhooks**.

        **Status mappings:**
        | DoorDash status | Order status |
        |---|---|
        | `enroute_to_pickup` | `preparing` |
        | `arrived_at_pickup` | `ready` |
        | `picked_up` / `enroute_to_dropoff` | `out_for_delivery` |
        | `delivered` | `delivered` |
        | `delivery_cancelled` / `returned` | `cancelled` |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_delivery_id:
                  type: string
                  example: ORD-ABC12345
                  description: Matches the order_number
                delivery_status:
                  type: string
                  example: picked_up
                tracking_url:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Webhook processed

  # ── DELIVERY QUOTE (UNIFIED) ───────────────────────────────────────────────

  /delivery/quote:
    post:
      tags:
        - Delivery Quote
      summary: Get delivery fee quote (all vendors)
      description: |
        Single endpoint for all delivery vendors. Pass `vendor` to route to the correct provider.

        | Vendor | Endpoint Used | Notes |
        |--------|--------------|-------|
        | `doordash` | `POST /drive/v1/estimates` (Classic Drive API) | Returns real fee + tax + ETA. Falls back to Drive v2 quotes for newer accounts. |
        | `ubereats` | Zone-based estimate | UberEats manages actual fee at checkout |
        | `instacart` | Zone-based estimate | Instacart manages actual fee |
        | `own` | Exact fee from delivery zone config | Returns `in_zone: false` if no zone covers the location |

        ### DoorDash Quote Strategy (3-attempt fallback chain)
        1. `POST /drive/v1/estimates` — Classic Drive API. Returns `fee`, `tax`, `pickup_time`, `delivery_time` without creating a delivery.
        2. `POST /drive/v2/deliveries/quotes` — Drive API v2. Used for newer accounts that don't have Classic Drive.
        3. `POST /drive/v2/deliveries` + immediate cancel — Last resort for v2 accounts where the quotes endpoint is disabled.

        Pass `business_id` to automatically use the business's phone for the pickup contact.
        Pass `customer_phone` to use the real customer phone for the dropoff contact (improves DoorDash validation).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vendor
              properties:
                vendor:
                  type: string
                  enum: [doordash, ubereats, instacart, own]
                  example: doordash
                pickup_address:
                  type: string
                  description: |
                    Pickup address for doordash. Optional if `business_id` is provided —
                    the business's saved address is used automatically.
                  example: "123 Main St, Los Angeles, CA 90012"
                dropoff_address:
                  type: string
                  description: Dropoff (customer) address — required for doordash
                  example: "456 Oak Ave, Los Angeles, CA 90001"
                order_value:
                  type: number
                  description: Order subtotal in dollars (used for DoorDash fee calculation)
                  example: 35.50
                business_id:
                  type: integer
                  description: |
                    Required for ubereats / instacart / own.
                    For doordash: auto-fills `pickup_address` from the business's saved address
                    and uses the business phone as the pickup contact.
                  example: 1
                lat:
                  type: number
                  description: Customer latitude (for zone matching with own/ubereats/instacart)
                  example: 34.0522
                lng:
                  type: number
                  description: Customer longitude (for zone matching)
                  example: -118.2437
                customer_phone:
                  type: string
                  description: Customer phone number (doordash only — used as dropoff contact, any format accepted)
                  example: "+13105551234"
      responses:
        "200":
          description: Quote result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryQuoteResponse"
              examples:
                doordash:
                  summary: DoorDash Classic v1/estimates response
                  value:
                    success: true
                    vendor: doordash
                    fee: 5.99
                    fee_cents: 599
                    tax: 0.52
                    tax_cents: 52
                    currency: USD
                    estimated_minutes: 42
                    pickup_time: "2026-03-02T17:30:00Z"
                    delivery_time: "2026-03-02T18:12:00Z"
                    quote_id: "48173944"
                    min_order_amount: 0
                    expires_at: null
                    zone: null
                own_delivery:
                  summary: Own delivery zone response
                  value:
                    success: true
                    vendor: own
                    fee: 3.99
                    fee_cents: 399
                    currency: USD
                    estimated_minutes: 30
                    min_order_amount: 15.00
                    in_zone: true
                    zone:
                      id: 1
                      name: Downtown LA
                      description: "5 mile radius"
        "422":
          description: Missing required fields for the selected vendor

  # ── TAX LOOKUP ───────────────────────────────────────────────────────────────

  /ecommerce/tax:
    get:
      tags:
        - Tax
      summary: Look up sales tax by ZIP code (GET)
      description: |
        Returns the US sales tax rate for a given 5-digit ZIP code.
        Optionally calculates the tax amount if `subtotal` is provided.

        Data source: Avalara ZIP-based tax rate tables (March 2026).
        Covers all 50 US states, DC, and Puerto Rico.

        **Workflow:**
        1. Call this endpoint with the delivery ZIP code and order subtotal
        2. Use `tax_rate` (a decimal like `0.0975`) — convert to percentage for checkout: `tax_rate * 100`
        3. Pass that percentage as `tax_rate` to `POST /api/ecommerce/checkout`

        **Risk level:** ZIP codes spanning multiple tax jurisdictions have `risk_level > 0`.
        The returned rate may vary by ±5% for those cases.
      security: []
      parameters:
        - name: zip
          in: query
          required: true
          description: 5-digit US ZIP code
          schema:
            type: string
            pattern: '^\d{5}$'
            example: "90001"
        - name: subtotal
          in: query
          required: false
          description: Order subtotal in dollars — used to calculate tax_amount and total
          schema:
            type: number
            format: float
            example: 100.00
      responses:
        "200":
          description: Tax data for the ZIP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxResponse"
              examples:
                los_angeles:
                  summary: Los Angeles, CA (90001) — $100 subtotal
                  value:
                    success: true
                    data:
                      found: true
                      zip_code: "90001"
                      tax_region: "HUNTINGTON PARK"
                      state: "CA"
                      tax_rate: 0.105
                      tax_percentage: "10.5000%"
                      tax_amount: "10.50"
                      subtotal: "100.00"
                      total: "110.50"
                      risk_level: 0
                      breakdown:
                        state_rate: 0.06
                        county_rate: 0.0025
                        city_rate: 0.0075
                        special_rate: 0.035
                no_tax_state:
                  summary: Anchorage, AK (99501) — zero sales tax
                  value:
                    success: true
                    data:
                      found: true
                      zip_code: "99501"
                      tax_region: "ANCHORAGE BOROUGH"
                      state: "AK"
                      tax_rate: 0.0
                      tax_percentage: "0.0000%"
                      tax_amount: "0.00"
                      subtotal: "100.00"
                      total: "100.00"
                      risk_level: 0
                      breakdown:
                        state_rate: 0.0
                        county_rate: 0.0
                        city_rate: 0.0
                        special_rate: 0.0
        "404":
          description: ZIP code not found in tax database
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "No tax data found for ZIP code 00000. It may not exist or may be outside the US."
        "422":
          description: Validation error — invalid ZIP format

    post:
      tags:
        - Tax
      summary: Look up sales tax by ZIP code (POST)
      description: |
        Same as GET `/ecommerce/tax` but accepts a JSON body.
        Useful when building mobile apps or passing data from a form.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - zip
              properties:
                zip:
                  type: string
                  pattern: '^\d{5}$'
                  description: 5-digit US ZIP code
                  example: "10001"
                subtotal:
                  type: number
                  format: float
                  description: Order subtotal in dollars
                  example: 75.50
            example:
              zip: "10001"
              subtotal: 75.50
      responses:
        "200":
          description: Tax data for the ZIP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxResponse"
              example:
                success: true
                data:
                  found: true
                  zip_code: "10001"
                  tax_region: "NEW YORK CITY"
                  state: "NY"
                  tax_rate: 0.08875
                  tax_percentage: "8.8750%"
                  tax_amount: "6.70"
                  subtotal: "75.50"
                  total: "82.20"
                  risk_level: 0
                  breakdown:
                    state_rate: 0.04
                    county_rate: 0.0
                    city_rate: 0.045
                    special_rate: 0.00375
        "404":
          description: ZIP code not found
        "422":
          description: Validation error

  # ── DELIVERY SETTINGS ────────────────────────────────────────────────────────

