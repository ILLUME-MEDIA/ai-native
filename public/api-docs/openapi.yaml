          example:
            doordash:
              success: true
              vendor: doordash
              fee: 5.99
              fee_cents: 599
              currency: USD
              estimated_minutes: 42
            uber_direct:
              success: true
              vendor: uber_direct
              fee: 7.50
              fee_cents: 750
              currency: USD
              estimated_minutes: 30
