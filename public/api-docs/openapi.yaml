          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of drivers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDeliveryStaff"
    post:
      tags:
        - Delivery Staff
      summary: Create driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryStaffInput"
      responses:
        "201":
          description: Driver created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryStaff"

  /delivery/staff/available:
    get:
      tags:
        - Delivery Staff
      summary: Get available drivers (for assignment dropdown)
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of available drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryStaff"

  /delivery/staff/locations:
    get:
      tags:
        - Delivery Staff
      summary: Real-time GPS locations of all active drivers
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Drivers with location data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    status:
                      type: string
                    current_lat:
                      type: number
                      nullable: true
                    current_lng:
                      type: number
                      nullable: true
                    location_updated_at:
                      type: string
                      format: date-time
                      nullable: true

  /delivery/staff/{deliveryStaff}:
    get:
      tags:
        - Delivery Staff
      summary: Driver detail (includes last 10 assignments)
      parameters:
        - name: deliveryStaff
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryStaff"
    patch:
      tags:
        - Delivery Staff
      summary: Update driver
      parameters:
        - name: deliveryStaff
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryStaffInput"
      responses:
        "200":
          description: Driver updated
    delete:
      tags:
        - Delivery Staff
      summary: Delete driver (soft delete)
      parameters:
        - name: deliveryStaff
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /delivery/staff/{deliveryStaff}/token:
    post:
      tags:
        - Delivery Staff
      summary: Generate Driver App token
      description: |
        Generates a new Bearer token for the driver to use in the Driver App.
        **The token is shown only once** — share it with the driver immediately.
      parameters:
        - name: deliveryStaff
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "xxxxxxxxxxxxxxxx80chars"
                  driver_id:
                    type: integer
                  driver_name:
                    type: string
                  message:
                    type: string
                    example: "New token generated. Share this with the driver app. It will not be shown again."

  # ── DELIVERY ASSIGNMENTS ─────────────────────────────────────────────────────

  /delivery/assignments:
    get:
      tags:
        - Delivery Assignments
      summary: List all assignments
      parameters:
        - name: driver_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [assigned, accepted, rejected, picked_up, out_for_delivery, delivered, failed, cancelled]
        - name: business_id
          in: query
          schema:
            type: integer
        - name: is_current
          in: query
          schema:
            type: boolean
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAssignments"

  /delivery/assignments/assign:
    post:
      tags:
        - Delivery Assignments
      summary: Assign driver to order (manual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, driver_id]
              properties:
                order_id:
                  type: integer
                  example: 42
                driver_id:
                  type: integer
                  example: 5
                zone_id:
                  type: integer
                  nullable: true
                driver_earnings:
                  type: number
                  example: 3.50
      responses:
        "200":
          description: Driver assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: "#/components/schemas/Order"
        "422":
          description: Driver is offline or inactive

  /delivery/assignments/auto-assign:
    post:
      tags:
        - Delivery Assignments
      summary: Auto-assign nearest available driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: integer
                  example: 42
      responses:
        "200":
          description: Driver auto-assigned
        "422":
          description: No available drivers at this time

  /delivery/assignments/orders/{order}/unassign:
    post:
      tags:
        - Delivery Assignments
      summary: Unassign driver from order
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment cancelled
        "404":
          description: No active assignment found

  /delivery/assignments/{assignment}/status:
    patch:
      tags:
        - Delivery Assignments
      summary: Update assignment status (admin)
      parameters:
        - name: assignment
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [assigned, accepted, rejected, picked_up, out_for_delivery, delivered, failed, cancelled]
                  example: picked_up
                driver_notes:
                  type: string
                  nullable: true
                rejection_reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAssignment"

  # ── UBEREATS ─────────────────────────────────────────────────────────────────

  /delivery/ubereats/config:
    get:
      tags:
        - UberEats Integration
      summary: Get webhook URL and setup instructions
      responses:
        "200":
          description: Config and setup steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_url:
                    type: string
                    example: "https://yourdomain.com/api/webhooks/delivery/ubereats"
                  setup_steps:
                    type: array
                    items:
                      type: string
                  platform:
                    type: string
                    example: ubereats
                  docs_url:
                    type: string

  /delivery/ubereats/orders:
    get:
      tags:
        - UberEats Integration
      summary: List UberEats platform orders
      parameters:
        - name: business_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [received, accepted, rejected, preparing, ready, picked_up, delivered, cancelled, failed]
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated UberEats orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPlatformOrders"

  /delivery/ubereats/orders/{platformOrder}/accept:
    post:
      tags:
        - UberEats Integration
      summary: Accept UberEats order → creates internal order
      description: Accepts the incoming UberEats order, creates an internal `Order` record and links order items.
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prep_time_minutes:
                  type: integer
                  example: 20
                  description: Override estimated prep time
      responses:
        "200":
          description: Order accepted and internal order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: UberEats order accepted.
                  platform_order:
                    $ref: "#/components/schemas/PlatformOrder"
        "422":
          description: Order already processed or wrong platform

  /delivery/ubereats/orders/{platformOrder}/reject:
    post:
      tags:
        - UberEats Integration
      summary: Reject UberEats order
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Kitchen closed
      responses:
        "200":
          description: Order rejected

  /delivery/ubereats/orders/{platformOrder}/status:
    patch:
      tags:
        - UberEats Integration
      summary: Update order status (sent back to UberEats)
      parameters:
        - name: platformOrder
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [preparing, ready, picked_up, delivered, cancelled]
                  example: preparing
      responses:
        "200":
          description: Status updated

  /webhooks/delivery/ubereats:
    post:
      tags:
        - UberEats Integration
      summary: UberEats webhook receiver
      description: |
        UberEats posts order events here. Configure this URL in the UberEats Merchant Portal.

        **Handled events:**
        - `orders.notification` / `eats.order` → creates `PlatformOrder` (status=received)
        - `orders.cancel` → marks order as cancelled
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw UberEats webhook payload
      responses:
        "200":
          description: Processed

  # ── INSTACART ────────────────────────────────────────────────────────────────

